        `;
        e.preventDefault();

  <!-- Fallback: if unpkg fails, we rewrite imports to skypack -->
  <script>
    (function() {
      const fallbackCDNs = {
        'react': 'https://cdn.skypack.dev/react@19.0.0',
        'react-dom/client': 'https://cdn.skypack.dev/react-dom@19.0.0/client',
        'zustand': 'https://cdn.skypack.dev/zustand@5.0.0',
        'framer-motion': 'https://cdn.skypack.dev/framer-motion@11.11.11',
        'lucide-react': 'https://cdn.skypack.dev/lucide-react@0.460.0'
      };
      // Attempt to detect module load failure by adding a timeout
      let loadFailed = false;
      const observer = new PerformanceObserver((list) => {
        for (const entry of list.getEntries()) {
          if (entry.initiatorType === 'script' && entry.name.includes('unpkg.com') && entry.responseStatus !== 200) {
            loadFailed = true;
          }
        }
        if (loadFailed) {
          // Override import map dynamically
          const im = document.querySelector('script[type="importmap"]');
          const newMap = { imports: fallbackCDNs };
          im.textContent = JSON.stringify(newMap);
          console.warn('[LoveConnect] Unpkg failed, switched to Skypack');
          // Reload the main module
          const mainModule = document.querySelector('script[type="module"]');
          if (mainModule) {
            const newScript = document.createElement('script');
            newScript.type = 'module';
            newScript.textContent = mainModule.textContent;
            mainModule.remove();
            document.body.appendChild(newScript);
          }
        }
      });
      observer.observe({ entryTypes: ['resource'] });
      setTimeout(() => observer.disconnect(), 3000);
    })();
  </script>
