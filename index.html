<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FlameMatch · Premium Live Dating with CameraEngine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 30% 10%, #0b0918, #010002);
            --panel-bg: rgba(25, 24, 38, 0.85);
            --panel-border: rgba(236, 72, 153, 0.25);
            --text-primary: #f8fafc;
            --text-secondary: #cbc3f0;
            --accent-color: #ec4899;
            --accent-glow: rgba(236, 72, 153, 0.25);
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            --card-radius: 48px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            font-family: var(--font-sans);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            perspective: 1000px;
        }

        .dating-app {
            max-width: 400px;
            width: 100%;
            height: 780px;
            background: rgba(12, 10, 22, 0.85);
            backdrop-filter: blur(2px);
            border-radius: var(--card-radius);
            box-shadow: 0 30px 50px -15px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(236, 72, 153, 0.4), 0 0 0 6px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .auth-container {
            max-width: 400px;
            width: 100%;
            height: 780px;
            background: rgba(8, 6, 16, 0.96);
            backdrop-filter: blur(20px);
            border-radius: var(--card-radius);
            box-shadow: 0 30px 50px -15px black, 0 0 0 2px rgba(236, 72, 153, 0.5);
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
        }

        .auth-logo { text-align: center; margin-bottom: 40px; }
        .auth-logo h1 { font-size: 3rem; background: linear-gradient(125deg, #F472B6, #EC4899, #A855F7); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .auth-input, .auth-select {
            background: #1e1c2c;
            border: 1px solid rgba(236, 72, 153, 0.4);
            border-radius: 60px;
            padding: 16px 20px;
            width: 100%;
            margin-bottom: 16px;
            color: white;
            font-size: 15px;
            outline: none;
        }
        .auth-input:focus, .auth-select:focus { border-color: #ec4899; box-shadow: 0 0 8px #ec4899; }
        .auth-btn {
            background: linear-gradient(135deg, #ec4899, #be185d);
            border: none;
            border-radius: 60px;
            padding: 14px;
            font-weight: bold;
            font-size: 18px;
            color: white;
            cursor: pointer;
            margin-top: 12px;
        }
        .auth-error { color: #ff8989; font-size: 13px; text-align: center; margin-top: 8px; }
        .auth-switch { text-align: center; margin-top: 24px; color: #b9b1e6; }
        .auth-switch span { color: #ec4899; cursor: pointer; font-weight: bold; }

        .main-header {
            padding: 12px 20px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 18, 0.8);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--panel-border);
        }
        .logo-area h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(125deg, #F472B6, #EC4899, #A855F7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .coin-badge {
            background: rgba(32, 33, 48, 0.9);
            backdrop-filter: blur(8px);
            padding: 6px 16px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            color: #FBBF24;
            font-size: 15px;
            border: 0.5px solid rgba(251, 191, 36, 0.3);
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 18px 16px;
            scroll-behavior: smooth;
        }

        .modern-card {
            position: relative;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: var(--card-radius);
            backdrop-filter: blur(12px);
            overflow: hidden;
            transition: var(--transition-smooth);
            opacity: 0;
            transform: translateY(40px) scale(0.98);
            will-change: transform, opacity;
        }
        .modern-card.is-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .modern-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(236, 72, 153, 0.6);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 50px var(--accent-glow);
        }
        .modern-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(600px circle at var(--mouse-x, 0px) var(--mouse-y, 0px), rgba(255, 255, 255, 0.08), transparent 60%);
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .modern-card:hover::after { opacity: 1; }
        .card-content { position: relative; z-index: 2; }

        .profile-img { height: 300px; position: relative; overflow: hidden; border-radius: var(--card-radius) var(--card-radius) 0 0; }
        .profile-img img { width: 100%; height: 100%; object-fit: cover; }
        .match-percent-badge {
            position: absolute; top: 20px; right: 20px; z-index: 3;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(12px);
            padding: 8px 16px; border-radius: 60px; font-weight: 800;
            color: white; border: 1px solid #f472b6;
        }
        .profile-info { padding: 22px 20px; }
        .profile-name { font-size: 28px; font-weight: 800; color: white; display: flex; justify-content: space-between; }
        .profile-occupation { font-size: 14px; color: #c084fc; margin-top: 4px; }
        .profile-bio { color: var(--text-secondary); margin-top: 12px; font-size: 14px; line-height: 1.4; }

        .action-buttons { display: flex; justify-content: space-around; padding: 12px 24px 28px; gap: 24px; }
        .action-btn {
            background: #24222f; border: none; width: 68px; height: 68px;
            border-radius: 68px; font-size: 32px; color: white;
            cursor: pointer; transition: 0.2s;
        }
        .btn-like { background: linear-gradient(145deg, #ec4899, #be185d); box-shadow: 0 0 12px #ec4899; }
        .btn-super { background: linear-gradient(145deg, #f59e0b, #b45309); }
        .btn-pass { background: #2e2a3e; color: #ffb3b3; }

        .match-item { display: flex; align-items: center; gap: 16px; padding: 10px 16px; margin-bottom: 14px; }
        .match-avatar { width: 58px; height: 58px; border-radius: 58px; overflow: hidden; border: 2px solid #ec4899; }
        .match-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .match-info { flex: 1; }
        .match-name { font-weight: 800; color: white; font-size: 16px; }
        .match-percentage { font-size: 12px; color: #fbbf24; background: #1e1c2c; padding: 2px 10px; border-radius: 40px; margin-left: 8px; }
        .chat-btn { background: #ec4899; border: none; padding: 8px 20px; border-radius: 40px; color: white; font-weight: 700; cursor: pointer; }

        .chat-header-match { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; background: rgba(18, 18, 26, 0.9); border-radius: 60px; padding: 10px 18px; }
        .messages-box { background: rgba(8, 8, 16, 0.7); border-radius: 36px; padding: 18px; height: 440px; overflow-y: auto; display: flex; flex-direction: column; }
        .msg-bubble { max-width: 80%; padding: 10px 16px; border-radius: 26px; margin-bottom: 8px; word-break: break-word; }
        .msg-sent { background: linear-gradient(135deg, #ec4899, #be185d); align-self: flex-end; color: white; }
        .msg-received { background: #252432; align-self: flex-start; color: white; }
        .chat-input-area { display: flex; gap: 12px; margin-top: 14px; background: #12121c; border-radius: 60px; padding: 6px 12px; align-items: center; }

        .live-video-wrapper video {
            width: 100%;
            border-radius: 40px;
            transform: scaleX(-1);
            background: #000;
            object-fit: cover;
            max-height: 460px;
        }
        .live-controls { display: flex; gap: 20px; justify-content: center; padding: 20px; }
        .live-btn { background: linear-gradient(145deg, #ec4899, #a21caf); border: none; padding: 12px 24px; border-radius: 60px; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .live-btn:active { transform: scale(0.96); }

        .my-profile-card { text-align: center; padding: 28px 24px; }
        .user-profile-photo { width: 110px; height: 110px; border-radius: 110px; overflow: hidden; margin: 0 auto; border: 3px solid #ec4899; }
        .user-profile-photo img { width: 100%; height: 100%; object-fit: cover; }
        .edit-field { background: #23222e; border: 1px solid #ec4899; padding: 14px; border-radius: 60px; color: white; width: 100%; margin-top: 12px; }
        .upload-label { background: #2e2a3e; padding: 10px 18px; border-radius: 60px; display: inline-block; margin: 8px; cursor: pointer; color: white; }
        .reset-photo-btn { background: #1e1c2c; padding: 10px 18px; border-radius: 60px; cursor: pointer; border: none; color: white; }

        .bottom-nav {
            background: rgba(8, 8, 14, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-around;
            padding: 10px 12px 20px;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #6f6b8a; cursor: pointer; font-size: 11px; font-weight: 600; transition: 0.2s; }
        .nav-active { color: #f472b6; text-shadow: 0 0 8px #ec4899; }
        .reset-btn { background: rgba(236, 72, 153, 0.2); border: 1px solid #ec4899; padding: 12px; border-radius: 40px; width: 100%; color: white; font-weight: bold; cursor: pointer; }
        .swipe-hint { text-align: center; font-size: 11px; margin-top: 12px; color: #aa99e6; }
        
        .video-call-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100; border-radius: var(--card-radius);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .remote-video { width: 100%; height: 100%; object-fit: cover; }
        .local-video-pip {
            position: absolute; top: 20px; right: 20px; width: 100px; height: 150px;
            border-radius: 16px; object-fit: cover; border: 2px solid #ec4899;
            transform: scaleX(-1); background: #222; z-index: 110;
        }
        .call-controls {
            position: absolute; bottom: 30px; left: 0; width: 100%;
            display: flex; justify-content: center; gap: 20px; z-index: 110;
        }
        .call-btn {
            width: 56px; height: 56px; border-radius: 56px; border: none;
            color: white; font-size: 20px; cursor: pointer; display: flex;
            align-items: center; justify-content: center;
        }
        .btn-hangup { background: #ef4444; }
        .btn-mute { background: rgba(255,255,255,0.2); backdrop-filter: blur(8px); }
        
        .chat-media-attachment { max-width: 100%; border-radius: 16px; margin-top: 6px; display: block; }
    </style>
</head>
<body>
<div id="root"></div>

<script>
    // -------------------------- CAMERA ENGINE --------------------------
    class CameraEngine {
        constructor(videoElementId) {
            this.videoElement = typeof videoElementId === 'string' ? document.getElementById(videoElementId) : videoElementId;
            this.localStream = null;
            if (!this.videoElement) throw new Error("Target video container configuration missing.");
        }

        getOptimalConstraints() {
            return {
                audio: { echoCancellation: true, noiseSuppression: true },
                video: {
                    width: { ideal: 1280, max: 1920 },
                    height: { ideal: 720, max: 1080 },
                    aspectRatio: 1.777777778,
                    frameRate: { ideal: 30 },
                    facingMode: "user"
                }
            };
        }

        async startStream() {
            try {
                if (!navigator.mediaDevices?.getUserMedia) throw new Error("MediaDevices API structural failure.");
                this.localStream = await navigator.mediaDevices.getUserMedia(this.getOptimalConstraints());
                this.videoElement.srcObject = this.localStream;
                this.videoElement.onloadedmetadata = () => {
                    this.videoElement.play().catch(err => console.warn("Autoplay deferred:", err));
                };
                return this.localStream;
            } catch (error) {
                this.handleError(error);
                throw error;
            }
        }

        stopStream() {
            if (!this.localStream) return;
            this.localStream.getTracks().forEach(track => {
                track.stop();
                track.enabled = false;
            });
            this.videoElement.srcObject = null;
            this.localStream = null;
        }

        handleError(error) {
            let msg = error.name === 'NotAllowedError' ? "Permission denied." : `Camera Error: ${error.message}`;
            console.error("[CameraEngine]", msg);
            showToast(msg, "#ff4d4d");
        }
    }

    // -------------------------- INFINITE DISCOVERY FACTORY --------------------------
    class ProfileFactory {
        static names = ["Amani", "Zendaya", "Jabari", "Chloe", "Malik", "Elena", "Siddharth", "Yuki", "Mateo", "Seraphina", "Kaelen", "Tariq"];
        static occupations = ["Software Architect", "Creative Director", "Aerospace Engineer", "Venture Capitalist", "Fine Art Curator", "Product Designer", "Clinical Strategist"];
        static bios = [
            "Architecting clean code and clean design systems. Let's debate performance profiles over coffee.",
            "Living at the intersection of media arts and physical installations. Looking for an inspired conversationalist.",
            "High-energy strategist, mountain trail running enthusiast, and late-night culinary experimenting specialist.",
            "Building high-scale frameworks by day. Searching for aesthetic minimalism and real, unfiltered connections."
        ];
        static photos = [
            "https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=600&q=80",
            "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600&q=80",
            "https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=600&q=80",
            "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=600&q=80",
            "https://images.unsplash.com/photo-1502685104226-ee32379fefbe?w=600&q=80",
            "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=600&q=80"
        ];

        static generateNext() {
            const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
            const id = `p_gen_${Date.now()}_${Math.floor(Math.random()*1000)}`;
            return {
                id,
                name: pick(this.names),
                age: Math.floor(Math.random() * 15) + 21,
                occupation: pick(this.occupations),
                matchPercentage: Math.floor(Math.random() * 25) + 75,
                bio: pick(this.bios),
                photoURL: pick(this.photos),
                liked: false
            };
        }
    }

    // -------------------------- PERSISTENT AUTH (localStorage) --------------------------
    let users = JSON.parse(localStorage.getItem("flamematch_users")) || [];
    let currentSessionUser = JSON.parse(localStorage.getItem("flamematch_session")) || null;

    function saveUsers() { localStorage.setItem("flamematch_users", JSON.stringify(users)); }
    function saveSession(user) { currentSessionUser = user; localStorage.setItem("flamematch_session", JSON.stringify(user)); }
    function clearSession() { localStorage.removeItem("flamematch_session"); currentSessionUser = null; }

    function signup(email, password, name, age, country) {
        if (!email || !password || !name || !age || !country) return { success: false, error: "All fields required" };
        if (users.find(u => u.email === email)) return { success: false, error: "Email already registered." };
        const newUser = { id: Date.now().toString(), email, password, name, age: parseInt(age), country, bio: "✨ Let's connect!", photoId: "user_alex_def", coins: 450 };
        users.push(newUser);
        saveUsers();
        return { success: true, user: newUser };
    }

    function login(email, password) {
        const user = users.find(u => u.email === email && u.password === password);
        if (!user) return { success: false, error: "Invalid credentials." };
        return { success: true, user };
    }

    let appData = { discoverProfiles: [], matchesList: [], userCoins: 450, currentUserBio: "", customUserPhotoURL: null };
    
    function loadUserData(userId) {
        const stored = localStorage.getItem(`flamematch_data_${userId}`);
        if (stored) {
            const data = JSON.parse(stored);
            appData.discoverProfiles = data.discoverProfiles || [];
            appData.matchesList = data.matchesList || [];
            appData.userCoins = data.userCoins !== undefined ? data.userCoins : 450;
            appData.currentUserBio = data.currentUserBio || "";
            appData.customUserPhotoURL = data.customPhotoURL || null;
        } else {
            appData.discoverProfiles = [];
            appData.matchesList = [];
            appData.userCoins = 450;
            appData.currentUserBio = "";
            appData.customUserPhotoURL = null;
        }
        while(appData.discoverProfiles.length < 5) {
            appData.discoverProfiles.push(ProfileFactory.generateNext());
        }
    }

    function saveUserData(userId) {
        const data = { discoverProfiles: appData.discoverProfiles, matchesList: appData.matchesList, userCoins: appData.userCoins, currentUserBio: appData.currentUserBio, customPhotoURL: appData.customUserPhotoURL };
        localStorage.setItem(`flamematch_data_${userId}`, JSON.stringify(data));
    }

    let activeTab = "discover";
    let currentChatPartner = null;
    let cameraEngineInstance = null;
    let globalLiveViewerInterval = null;

    function clearLiveInterval() { if (globalLiveViewerInterval) { clearInterval(globalLiveViewerInterval); globalLiveViewerInterval = null; } }
    function updateCoinUI() { const el = document.getElementById("coinAmount"); if (el) el.innerText = appData.userCoins; }

    function likeProfile(profile) {
        profile.liked = true;
        const willMatch = Math.random() > 0.3;
        if (willMatch) {
            appData.matchesList.unshift({
                id: profile.id, name: profile.name, age: profile.age, occupation: profile.occupation,
                matchPercentage: profile.matchPercentage, photoURL: profile.photoURL,
                lastMessage: "You matched! Tap call or chat to begin.", chatMessages: []
            });
            showToast(`💖 Match with ${profile.name}!`, "#ec4899");
        } else {
            showToast(`Liked ${profile.name}`, "#be185d");
        }
        consumeDiscoverHead();
    }

    function passProfile(profile) {
        showToast(`Passed on ${profile.name}`, "#475569");
        consumeDiscoverHead();
    }

    function superLike(profile) {
        if (appData.userCoins < 50) { showToast("💎 Insufficient gems.", "#ff4d4d"); return; }
        appData.userCoins -= 50;
        updateCoinUI();
        appData.matchesList.unshift({
            id: profile.id, name: profile.name, age: profile.age, occupation: profile.occupation,
            matchPercentage: profile.matchPercentage, photoURL: profile.photoURL,
            lastMessage: "Instant SuperMatch active!", chatMessages: []
        });
        showToast(`⭐ SuperMatch with ${profile.name}!`, "#fbbf24");
        consumeDiscoverHead();
    }

    function consumeDiscoverHead() {
        appData.discoverProfiles.shift();
        while(appData.discoverProfiles.length < 5) {
            appData.discoverProfiles.push(ProfileFactory.generateNext());
        }
        saveUserData(currentSessionUser.id);
        renderCurrentTab();
    }

    // -------------------------- MOCK VIDEO CALL --------------------------
    let activeCallEngine = null;
    function initializeVideoCall(partnerId) {
        const partner = appData.matchesList.find(m => m.id === partnerId);
        if (!partner) return;

        const container = document.getElementById("root");
        const callOverlay = document.createElement("div");
        callOverlay.className = "video-call-overlay";
        callOverlay.id = "videoCallOverlay";
        callOverlay.innerHTML = `
            <video id="remoteVideoView" class="remote-video" autoplay playsinline src="https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-light-background-41712-large.mp4" loop muted></video>
            <video id="localVideoPIP" class="local-video-pip" autoplay playsinline muted></video>
            <div class="call-controls">
                <button class="call-btn btn-mute" id="muteCallBtn"><i class="fas fa-microphone"></i></button>
                <button class="call-btn btn-hangup" id="hangupCallBtn"><i class="fas fa-phone-slash"></i></button>
            </div>
        `;
        container.appendChild(callOverlay);

        const localPip = document.getElementById("localVideoPIP");
        activeCallEngine = new CameraEngine(localPip);
        
        activeCallEngine.startStream().then(() => {
            const remoteVid = document.getElementById("remoteVideoView");
            remoteVid.play().catch(() => {});
        }).catch(err => {
            console.error("Call stream initialization rejected.", err);
        });

        document.getElementById("hangupCallBtn").onclick = () => {
            if (activeCallEngine) { activeCallEngine.stopStream(); activeCallEngine = null; }
            document.getElementById("videoCallOverlay").remove();
            showToast("Call disconnected", "#ef4444");
        };

        let isMuted = false;
        document.getElementById("muteCallBtn").onclick = () => {
            isMuted = !isMuted;
            if(activeCallEngine.localStream) {
                activeCallEngine.localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
            }
            document.getElementById("muteCallBtn").innerHTML = isMuted ? `<i class="fas fa-microphone-slash"></i>` : `<i class="fas fa-microphone"></i>`;
        };
    }

    // -------------------------- FILE ATTACHMENT --------------------------
    function processIncomingFile(file, partnerId) {
        if (!file) return;
        const isVideo = file.type.startsWith("video/");
        const isImage = file.type.startsWith("image/");
        if (!isImage && !isVideo) { showToast("Unsupported format", "#ef4444"); return; }

        const localBlobPointer = URL.createObjectURL(file);
        const match = appData.matchesList.find(m => m.id === partnerId);
        
        if (match) {
            match.chatMessages.push({
                sender: "me",
                time: "Just Now",
                text: isVideo ? "[Shared a Video]" : "[Shared a Photo]",
                attachment: localBlobPointer,
                attachmentType: isVideo ? "video" : "image"
            });
            match.lastMessage = isVideo ? "🎥 Video asset shared" : "📷 Photographic asset shared";
            saveUserData(currentSessionUser.id);
            renderChatScreen(partnerId);
        }
    }

    // -------------------------- RENDER CHAT --------------------------
    function renderChatScreen(partnerId) {
        const partner = appData.matchesList.find(m => m.id === partnerId); if (!partner) return;
        currentChatPartner = partner; const container = document.getElementById("appContent");
        
        let messagesHtml = ""; 
        partner.chatMessages.forEach(msg => {
            let mediaMarkup = "";
            if (msg.attachment) {
                if (msg.attachmentType === "video") {
                    mediaMarkup = `<video src="${msg.attachment}" class="chat-media-attachment" controls playsinline></video>`;
                } else {
                    mediaMarkup = `<img src="${msg.attachment}" class="chat-media-attachment">`;
                }
            }
            messagesHtml += `
                <div class="msg-bubble ${msg.sender === 'me' ? 'msg-sent' : 'msg-received'}">
                    ${msg.sender === 'them' ? `<strong>${partner.name}</strong><br>` : ''}
                    <div>${escapeHtml(msg.text)}</div>
                    ${mediaMarkup}
                </div>`;
        });

        container.innerHTML = `
            <div class="modern-card" style="padding:20px; height:100%; display:flex; flex-direction:column;">
                <div class="chat-header-match">
                    <div style="width:54px;height:54px;border-radius:54px;overflow:hidden;"><img src="${partner.photoURL || 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=600&q=80'}" style="width:100%;height:100%;object-fit:cover;"></div>
                    <div style="flex:1;">
                        <strong style="color:white;">${partner.name}</strong>
                        <div style="font-size:11px; color:#a855f7;"><i class="fas fa-bolt"></i> Realtime Available</div>
                    </div>
                    <i class="fas fa-video" id="initCallBtn" style="color:#ec4899; font-size:20px; cursor:pointer; margin-right:16px;"></i>
                    <i class="fas fa-arrow-left" id="backToMatchesBtn" style="color:#6f6b8a;font-size:20px;cursor:pointer;"></i>
                </div>
                <div class="messages-box" id="chatMessagesBox" style="flex:1;">${messagesHtml}</div>
                <div class="chat-input-area">
                    <label style="color:#ec4899; cursor:pointer; font-size:18px; padding: 0 8px;">
                        <i class="fas fa-paperclip"></i>
                        <input type="file" id="chatMediaInput" accept="image/*,video/*" style="display:none;">
                    </label>
                    <input id="chatMessageInput" placeholder="Message..." style="flex:1;background:transparent;border:none;color:white;padding:12px;outline:none;">
                    <button id="sendChatBtn" style="background:#ec4899;border:none;width:42px;height:42px;border-radius:42px;color:white;cursor:pointer;"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>`;

        document.getElementById("backToMatchesBtn").onclick = () => { currentChatPartner = null; activeTab = "matches"; renderCurrentTab(); };
        document.getElementById("initCallBtn").onclick = () => initializeVideoCall(partnerId);
        
        document.getElementById("chatMediaInput").onchange = (e) => {
            if(e.target.files.length > 0) processIncomingFile(e.target.files[0], partnerId);
        };

        const dispatchText = () => {
            const inp = document.getElementById("chatMessageInput");
            if (!inp.value.trim()) return;
            partner.chatMessages.push({ text: inp.value, sender: "me", time: "now" });
            partner.lastMessage = inp.value;
            saveUserData(currentSessionUser.id);
            inp.value = "";
            renderChatScreen(partnerId);
        };

        document.getElementById("sendChatBtn").onclick = dispatchText;
        document.getElementById("chatMessageInput").onkeydown = (e) => { if(e.key === "Enter") dispatchText(); };
        
        setTimeout(() => { const box = document.getElementById("chatMessagesBox"); if(box) box.scrollTop = box.scrollHeight; }, 50);
        attachModernCardStyles();
    }

    // -------------------------- DISCOVER TAB --------------------------
    function renderDiscoverTab() {
        const container = document.getElementById("appContent");
        if(appData.discoverProfiles.length === 0) { 
            container.innerHTML = `<div class="modern-card" style="text-align:center;padding:40px;"><p>Syncing network stream...</p></div>`; 
            return; 
        }
        
        const profile = appData.discoverProfiles[0];
        container.innerHTML = `
            <div class="modern-card" id="draggableCard">
                <div class="profile-img">
                    <div class="match-percent-badge"><i class="fas fa-chart-line"></i> ${profile.matchPercentage}% match</div>
                    <img src="${profile.photoURL}" draggable="false">
                </div>
                <div class="profile-info">
                    <div class="profile-name">${profile.name}, ${profile.age}</div>
                    <div class="profile-occupation">${profile.occupation}</div>
                    <div class="profile-bio">${profile.bio}</div>
                </div>
                <div class="action-buttons">
                    <button class="action-btn btn-pass" id="passBtn"><i class="fas fa-times"></i></button>
                    <button class="action-btn btn-super" id="superBtn"><i class="fas fa-star"></i></button>
                    <button class="action-btn btn-like" id="likeBtn"><i class="fas fa-heart"></i></button>
                </div>
            </div>
            <div class="swipe-hint"><i class="fas fa-arrows-alt-h"></i> Drag card left/right or use controls for continuous discovery</div>`;
        
        attachSwipeEvents(document.getElementById("draggableCard"), profile);
        document.getElementById("passBtn").onclick = () => passProfile(profile);
        document.getElementById("likeBtn").onclick = () => likeProfile(profile);
        document.getElementById("superBtn").onclick = () => superLike(profile);
        attachModernCardStyles();
    }

    // -------------------------- MATCHES TAB --------------------------
    function renderMatchesTab() {
        if (currentChatPartner) { renderChatScreen(currentChatPartner.id); return; }
        const container = document.getElementById("appContent");
        if (!appData.matchesList.length) { 
            container.innerHTML = `<div class="modern-card" style="text-align:center;padding:60px 20px;"><i class="fas fa-heart-broken" style="font-size:52px;color:#ec4899;margin-bottom:12px;"></i><p style="color:white;">No active connections. Keep swiping!</p></div>`; 
            attachModernCardStyles(); 
            return; 
        }
        let html = `<h3 style="color:white;margin-bottom:18px;">Verified Fits (${appData.matchesList.length})</h3>`;
        appData.matchesList.forEach(m => { 
            html += `
            <div class="modern-card match-item">
                <div class="match-avatar"><img src="${m.photoURL}"></div>
                <div class="match-info">
                    <div class="match-name">${m.name}, ${m.age} <span class="match-percentage">${m.matchPercentage}%</span></div>
                    <div style="color:#b9b1e6;font-size:13px;margin-top:2px;">${m.lastMessage.substring(0,35)}</div>
                </div>
                <button class="chat-btn" data-chatid="${m.id}"><i class="fas fa-comments"></i></button>
            </div>`; 
        });
        container.innerHTML = html;
        document.querySelectorAll(".chat-btn").forEach(btn => btn.onclick = () => renderChatScreen(btn.getAttribute("data-chatid")));
        attachModernCardStyles();
    }

    // -------------------------- LIVE TAB (fixed mirroring) --------------------------
    function renderLiveTab() {
        if (cameraEngineInstance) { cameraEngineInstance.stopStream(); cameraEngineInstance = null; }
        clearLiveInterval();
        const container = document.getElementById("appContent");
        container.innerHTML = `<div class="modern-card" style="padding:20px;"><div class="live-video-wrapper"><video id="liveVideoElement" autoplay playsinline muted style="transform:scaleX(-1);"></video></div><div class="live-controls"><button id="startLiveBtn" class="live-btn"><i class="fas fa-play"></i> START BROADCAST</button><button id="stopLiveBtn" class="live-btn" style="background:#4a2e3a;"><i class="fas fa-stop"></i> TERMINATE</button></div><div id="liveStatusMsg" style="text-align:center;margin-top:12px;color:white;">⚡ Ready to stream</div></div>`;
        
        const startBtn = document.getElementById("startLiveBtn");
        const stopBtn = document.getElementById("stopLiveBtn");
        const statusSpan = document.getElementById("liveStatusMsg");

        startBtn.onclick = async () => {
            if (cameraEngineInstance?.localStream) return;
            try {
                cameraEngineInstance = new CameraEngine("liveVideoElement");
                await cameraEngineInstance.startStream();
                let viewers = 42;
                statusSpan.innerHTML = `<span style="background:#e11d48; padding:6px 14px; border-radius:60px;">🔴 LIVE · ${viewers} viewers</span>`;
                globalLiveViewerInterval = setInterval(() => {
                    if (cameraEngineInstance?.localStream) {
                        viewers += Math.floor(Math.random() * 4);
                        statusSpan.innerHTML = `<span style="background:#e11d48; padding:6px 14px; border-radius:60px;">🔴 LIVE · ${viewers} viewers</span>`;
                    }
                }, 4000);
            } catch (err) { statusSpan.innerHTML = "❌ Hardware tracking blocked."; }
        };
        
        stopBtn.onclick = () => {
            if (cameraEngineInstance) { cameraEngineInstance.stopStream(); cameraEngineInstance = null; clearLiveInterval(); statusSpan.innerHTML = "⏹️ Transmission ended."; }
        };
        attachModernCardStyles();
    }

    // -------------------------- PROFILE TAB --------------------------
    function renderProfileTab() {
        const user = currentSessionUser;
        const container = document.getElementById("appContent");
        const avatarURL = appData.customUserPhotoURL || "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=600&q=80";
        container.innerHTML = `
            <div class="modern-card my-profile-card">
                <div class="user-profile-photo"><img src="${avatarURL}" id="profileAvatar"></div>
                <h2 style="color:white;margin-top:8px;">${user.name}, ${user.age}</h2>
                <p style="color:#cbc3f0;font-size:14px;margin-bottom:12px;">📍 ${user.country}</p>
                <div style="margin-bottom:16px;"><label class="upload-label"><i class="fas fa-camera"></i> Change Avatar <input type="file" id="profilePhotoFile" accept="image/*" style="display:none;"></label></div>
                <button id="logoutBtn" style="background:#2e2a3e;border:1px solid #ec4899;padding:12px;border-radius:60px;color:white;width:100%;cursor:pointer;font-weight:600;">🚪 Close Account Session</button>
            </div>`;
        
        document.getElementById("profilePhotoFile").onchange = (e) => {
            if(e.target.files[0]){
                if (appData.customUserPhotoURL) URL.revokeObjectURL(appData.customUserPhotoURL);
                appData.customUserPhotoURL = URL.createObjectURL(e.target.files[0]);
                saveUserData(currentSessionUser.id);
                renderProfileTab();
            }
        };
        document.getElementById("logoutBtn").onclick = () => { clearSession(); showAuthScreen(); };
        attachModernCardStyles();
    }

    // -------------------------- SWIPE GESTURES --------------------------
    let startX=0, currentX=0, isDragging=false;
    function attachSwipeEvents(card, profile) {
        if(!card) return;
        const onMove = (e) => {
            if(!isDragging) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            currentX = clientX - startX;
            card.style.transform = `translateX(${currentX}px) rotate(${currentX * 0.04}deg)`;
            card.style.opacity = Math.max(0.3, 1 - Math.abs(currentX)/350);
        };
        const onEnd = () => {
            if(!isDragging) return;
            isDragging = false;
            document.removeEventListener("mousemove", onMove);
            document.removeEventListener("mouseup", onEnd);
            document.removeEventListener("touchmove", onMove);
            document.removeEventListener("touchend", onEnd);
            
            if(currentX > 130) likeProfile(profile);
            else if(currentX < -130) passProfile(profile);
            else { card.style.transform = ""; card.style.opacity = ""; }
        };
        const onStart = (e) => {
            if (e.target.closest('.action-btn') || e.target.closest('input')) return;
            isDragging = true;
            startX = e.touches ? e.touches[0].clientX : e.clientX;
            currentX = 0;
            document.addEventListener("mousemove", onMove);
            document.addEventListener("mouseup", onEnd);
            document.addEventListener("touchmove", onMove, {passive:false});
            document.addEventListener("touchend", onEnd);
        };
        card.addEventListener("mousedown", onStart);
        card.addEventListener("touchstart", onStart, {passive:false});
    }

    // -------------------------- NAVIGATION & RENDERING --------------------------
    function renderCurrentTab() {
        if(activeTab==="discover") renderDiscoverTab();
        else if(activeTab==="matches") renderMatchesTab();
        else if(activeTab==="live") renderLiveTab();
        else if(activeTab==="profile") renderProfileTab();
        document.querySelectorAll(".nav-item").forEach(item=>item.classList.toggle("nav-active",item.getAttribute("data-tab")===activeTab));
        updateCoinUI();
    }

    function attachModernCardStyles() { window.uiEngineInstance?.observeCards(); }
    function showToast(msg,bg){ const t=document.createElement("div"); t.innerText=msg; Object.assign(t.style,{position:"fixed",bottom:"90px",left:"50%",transform:"translateX(-50%)",backgroundColor:bg,padding:"10px 20px",borderRadius:"60px",color:"white",zIndex:"9999",fontSize:"14px",fontWeight:"600"}); document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }
    function escapeHtml(str){ return str ? str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])) : ''; }

    class UIEngine {
        constructor() { this.initObserver(); this.initSpotlight(); }
        initObserver() { this.observer = new IntersectionObserver((entries) => { entries.forEach((entry, idx) => { if (entry.isIntersecting) { setTimeout(() => entry.target.classList.add('is-visible'), idx * 50); this.observer.unobserve(entry.target); } }); }, { threshold: 0.05 }); }
        initSpotlight() {
            const attach = (card) => {
                card.addEventListener('mousemove', (e) => { const rect = card.getBoundingClientRect(); card.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`); card.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`); });
            };
            new MutationObserver((mutations) => { mutations.forEach((m) => m.addedNodes.forEach((n) => { if (n.nodeType === 1 && n.matches('.modern-card')) attach(n); else if (n.nodeType === 1 && n.querySelectorAll) n.querySelectorAll('.modern-card').forEach(attach); })); }).observe(document.body, { childList: true, subtree: true });
        }
        observeCards() { document.querySelectorAll('.modern-card').forEach(c => this.observer?.observe(c)); }
    }

    // -------------------------- AUTHENTICATION SCREEN --------------------------
    function showAuthScreen() {
        if(cameraEngineInstance) { cameraEngineInstance.stopStream(); cameraEngineInstance = null; clearLiveInterval(); }
        const root = document.getElementById("root");
        root.innerHTML = `<div class="auth-container"><div class="auth-logo"><h1>FlameMatch</h1><p style="color:#c9c2f0;">Find your permanent flame 🔥</p></div><div id="authForm"><input type="email" id="authEmail" class="auth-input" placeholder="Email"><input type="password" id="authPassword" class="auth-input" placeholder="Password"><div id="authExtraFields" style="display:none;"><input type="text" id="authName" class="auth-input" placeholder="Full Name"><input type="number" id="authAge" class="auth-input" placeholder="Age"><select id="authCountry" class="auth-select"><option>United States</option><option>Canada</option><option>UK</option></select></div><button id="authSubmitBtn" class="auth-btn">Login Session</button><div class="auth-switch">New connection? <span id="toggleAuthMode">Register profile</span></div><div id="authError" class="auth-error"></div></div></div>`;
        
        let isLogin = true;
        const extraDiv = document.getElementById("authExtraFields");
        const submitBtn = document.getElementById("authSubmitBtn");
        const toggle = document.getElementById("toggleAuthMode");
        const errorDiv = document.getElementById("authError");

        toggle.onclick = () => { isLogin = !isLogin; extraDiv.style.display = isLogin ? "none" : "block"; submitBtn.innerText = isLogin ? "Login Session" : "Build Identity"; };
        
        submitBtn.onclick = () => {
            const email = document.getElementById("authEmail").value.trim();
            const password = document.getElementById("authPassword").value.trim();
            if (isLogin) {
                const res = login(email, password);
                if (res.success) { saveSession(res.user); loadUserData(res.user.id); initMainApp(); }
                else errorDiv.innerText = res.error;
            } else {
                const name = document.getElementById("authName").value.trim();
                const age = document.getElementById("authAge").value;
                if (!name || !age || age < 18) { errorDiv.innerText = "Valid age (18+) required."; return; }
                const res = signup(email, password, name, age, "United States");
                if (res.success) { saveSession(res.user); loadUserData(res.user.id); initMainApp(); }
                else errorDiv.innerText = res.error;
            }
        };
    }

    function initMainApp() {
        document.getElementById("root").innerHTML = `<div class="dating-app"><div class="main-header"><div class="logo-area"><h1>FlameMatch❤️‍🔥</h1></div><div class="coin-badge"><i class="fas fa-gem"></i> <span id="coinAmount">0</span></div></div><div class="content-area" id="appContent"></div><div class="bottom-nav"><div class="nav-item" data-tab="discover"><i class="fas fa-fire"></i><span>Discover</span></div><div class="nav-item" data-tab="matches"><i class="fas fa-heart"></i><span>Matches</span></div><div class="nav-item" data-tab="live"><i class="fas fa-video"></i><span>Broadcasting</span></div><div class="nav-item" data-tab="profile"><i class="fas fa-user"></i><span>Identity</span></div></div></div>`;
        window.uiEngineInstance = new UIEngine();
        
        document.querySelectorAll(".nav-item").forEach(item => {
            item.onclick = () => {
                const target = item.getAttribute("data-tab");
                if (activeTab === "live" && target !== "live") { cameraEngineInstance?.stopStream(); cameraEngineInstance = null; clearLiveInterval(); }
                activeTab = target; currentChatPartner = null;
                renderCurrentTab();
            };
        });
        renderCurrentTab();
    }

    // -------------------------- BOOTSTRAP --------------------------
    if (currentSessionUser) {
        loadUserData(currentSessionUser.id);
        initMainApp();
    } else {
        showAuthScreen();
    }
</script>
