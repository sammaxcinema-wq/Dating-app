<body>
<div id="root"></div>

<script>
    // -------------------------- PROFESSIONAL CAMERA ENGINE (FIXED CONSTRAINTS + INTERVAL CLEANUP) --------------------------
    class CameraEngine {
        constructor(videoElementId) {
            this.videoElement = document.getElementById(videoElementId);
            this.localStream = null;
            if (!this.videoElement) throw new Error(`Video element #${videoElementId} missing.`);
        }

        // FIX: Removed unsupported backgroundBlur constraint for audio
        getOptimalConstraints() {
            return {
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true
                    // backgroundBlur removed - invalid constraint for getUserMedia
                },
                video: {
                    width: { ideal: 1280, max: 1920 },
                    height: { ideal: 720, max: 1080 },
                    aspectRatio: 1.777777778,
                    frameRate: { ideal: 30, max: 60 },
                    facingMode: "user"
                }
            };
        }

        async startStream() {
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error("MediaDevices API not supported.");
                }
                const constraints = this.getOptimalConstraints();
                this.localStream = await navigator.mediaDevices.getUserMedia(constraints);
                this.videoElement.srcObject = this.localStream;
                this.videoElement.onloadedmetadata = () => {
                    this.videoElement.play().catch(err => console.warn("Autoplay blocked:", err));
                };
                return this.localStream;
            } catch (error) {
                this.handleError(error);
                throw error;
            }
        }

        stopStream() {
            if (!this.localStream) return;
            this.localStream.getTracks().forEach(track => track.stop());
            this.videoElement.srcObject = null;
            this.localStream = null;
        }

        handleError(error) {
            let msg = "";
            switch (error.name) {
                case 'NotAllowedError': msg = "Permission denied: allow camera & mic access."; break;
                case 'NotFoundError': msg = "No camera found on this device."; break;
                case 'NotReadableError': msg = "Camera busy / hardware locked."; break;
                case 'OverconstrainedError': msg = "Camera constraints not supported."; break;
                default: msg = `Camera error: ${error.message}`;
            }
            console.error("[CameraEngine]", msg);
            showToast(msg, "#ff4d4d");
        }
    }

    // Global interval for live viewer simulation (to ensure cleanup)
    let globalLiveViewerInterval = null;
    function clearLiveInterval() {
        if (globalLiveViewerInterval) {
            clearInterval(globalLiveViewerInterval);
            globalLiveViewerInterval = null;
        }
    }

    // -------------------------- AUTH & STORAGE --------------------------
    const countryList = ["United States", "Canada", "United Kingdom", "Australia", "Germany", "France", "Spain", "Italy", "Netherlands", "Sweden", "Brazil", "Mexico", "India", "Japan", "South Korea", "Kenya", "UAE"];
    let users = JSON.parse(localStorage.getItem("flamematch_users")) || [];
    let currentSessionUser = JSON.parse(sessionStorage.getItem("flamematch_session")) || null;
    function saveUsers() { localStorage.setItem("flamematch_users", JSON.stringify(users)); }
    function saveSession(user) { currentSessionUser = user; sessionStorage.setItem("flamematch_session", JSON.stringify(user)); }
    function clearSession() { sessionStorage.removeItem("flamematch_session"); currentSessionUser = null; }
    function signup(email, password, name, age, country) {
        if (!email || !password || !name || !age || !country) return { success: false, error: "All fields required" };
        if (users.find(u => u.email === email)) return { success: false, error: "Email already exists" };
        const newUser = { id: Date.now().toString(), email, password, name, age: parseInt(age), country, bio: "✨ New to FlameMatch. Let's connect!", photoId: "user_alex_def", coins: 450, customPhotoURL: null };
        users.push(newUser);
        saveUsers();
        return { success: true, user: newUser };
    }
    function login(email, password) {
        const user = users.find(u => u.email === email && u.password === password);
        if (!user) return { success: false, error: "Invalid email or password" };
        return { success: true, user };
    }

    let appData = { discoverProfiles: [], matchesList: [], userCoins: 450, currentUserBio: "", customUserPhotoURL: null };
    const DEFAULT_DISCOVER = [
        { id: "p_jennie", name: "Jennie Karao", age: 20, occupation: "UI Designer", matchPercentage: 89, bio: "Pixel perfect & latte art lover.", liked: false },
        { id: "p_natalie", name: "Natalie Morris", age: 25, occupation: "Fashion Designer", matchPercentage: 90, bio: "Runway dreams & thrift flips.", liked: false },
        { id: "p_emma", name: "Emma Ora", age: 24, occupation: "Comedian", matchPercentage: 100, bio: "Making you laugh is my superpower.", liked: false },
        { id: "p_diana", name: "Diana Morans", age: 32, occupation: "Influencer", matchPercentage: 89, bio: "Travel & lifestyle.", liked: false },
        { id: "p_maria", name: "Maria Sams", age: 25, occupation: "Doctor", matchPercentage: 78, bio: "ER by day, hiking & stargazing.", liked: false },
        { id: "p_liam2", name: "Liam Chen", age: 27, occupation: "Product Lead", matchPercentage: 92, bio: "Startup nerd + rock climber.", liked: false },
        { id: "p_sophia", name: "Sophia Rose", age: 23, occupation: "Photographer", matchPercentage: 96, bio: "Capturing light and feelings.", liked: false }
    ];
    const DEFAULT_MATCHES = [
        { id: "match_natalie", name: "Natalie Morris", age: 25, occupation: "Fashion Designer", matchPercentage: 90, lastMessage: "That outfit is fire! 🔥", chatMessages: [{ text: "Hey! Love your style 🔥", sender: "them", time: "2:30 PM" }, { text: "Let's grab coffee?", sender: "them", time: "2:32 PM" }] },
        { id: "match_emma", name: "Emma Ora", age: 24, occupation: "Comedian", matchPercentage: 100, lastMessage: "You're hilarious 😂", chatMessages: [{ text: "Haha your bio made me laugh", sender: "them", time: "Yesterday" }] }
    ];
    const PHOTOS = {
        p_jennie: "https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=600&q=80",
        p_natalie: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600&q=80",
        p_emma: "https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=600&q=80",
        p_diana: "https://images.unsplash.com/photo-1488716820095-cbe80883c496?w=600&q=80",
        p_maria: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=600&q=80",
        p_liam2: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=600&q=80",
        p_sophia: "https://images.unsplash.com/photo-1502685104226-ee32379fefbe?w=600&q=80",
        match_natalie: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600&q=80",
        match_emma: "https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=600&q=80",
        user_alex_def: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=600&q=80",
    };
    function photoUrl(id) { if (id === "user_alex" && appData.customUserPhotoURL) return appData.customUserPhotoURL; return PHOTOS[id] || PHOTOS.user_alex_def; }
    
    function loadUserData(userId) {
        const stored = localStorage.getItem(`flamematch_data_${userId}`);
        if (stored) {
            const data = JSON.parse(stored);
            appData.discoverProfiles = data.discoverProfiles || [...DEFAULT_DISCOVER];
            appData.matchesList = data.matchesList || [...DEFAULT_MATCHES];
            appData.userCoins = data.userCoins !== undefined ? data.userCoins : 450;
            appData.currentUserBio = data.currentUserBio || "";
            appData.customUserPhotoURL = data.customPhotoURL || null;
        } else {
            appData.discoverProfiles = [...DEFAULT_DISCOVER];
            appData.matchesList = [...DEFAULT_MATCHES];
            appData.userCoins = 450;
            appData.currentUserBio = "";
            appData.customUserPhotoURL = null;
        }
        const user = users.find(u => u.id === userId);
        if (user) user.coins = appData.userCoins;
    }
    function saveUserData(userId) {
        const data = { discoverProfiles: appData.discoverProfiles, matchesList: appData.matchesList, userCoins: appData.userCoins, currentUserBio: appData.currentUserBio, customPhotoURL: appData.customUserPhotoURL };
        localStorage.setItem(`flamematch_data_${userId}`, JSON.stringify(data));
        const user = users.find(u => u.id === userId);
        if (user) user.coins = appData.userCoins;
        saveUsers();
    }
    
    let activeTab = "discover";
    let currentChatPartner = null;
    let cameraEngineInstance = null;

    function updateCoinUI() { const el = document.getElementById("coinAmount"); if (el) el.innerText = appData.userCoins; }
    function addMatch(profile) { if (!appData.matchesList.find(m => m.id === profile.id)) { appData.matchesList.unshift({ id: profile.id, name: profile.name, age: profile.age, occupation: profile.occupation, matchPercentage: profile.matchPercentage, lastMessage: "You matched! Say hi ✨", chatMessages: [{ text: "You matched! Say hi ✨", sender: "them", time: "just now" }] }); return true; } return false; }
    function likeProfile(profile) { if (profile.liked) return; profile.liked = true; const willMatch = Math.random() > 0.25; if (willMatch) { const added = addMatch(profile); alert(added ? `💖 Match! You and ${profile.name} liked each other.` : `💕 You liked ${profile.name}!`); } else alert(`👍 You liked ${profile.name}!`); const idx = appData.discoverProfiles.findIndex(p => p.id === profile.id); if (idx !== -1) appData.discoverProfiles.splice(idx, 1); saveUserData(currentSessionUser.id); renderCurrentTab(); }
    function passProfile(profile) { const idx = appData.discoverProfiles.findIndex(p => p.id === profile.id); if (idx !== -1) appData.discoverProfiles.splice(idx, 1); saveUserData(currentSessionUser.id); renderCurrentTab(); }
    function superLike(profile) { if (appData.userCoins < 50) { alert("💎 Need 50 gems for SuperLike. Get daily bonus."); return; } appData.userCoins -= 50; updateCoinUI(); const added = addMatch(profile); alert(added ? `✨ SuperLiked ${profile.name}! Instant match ✨` : `✨ SuperLiked ${profile.name}`); const idx = appData.discoverProfiles.findIndex(p => p.id === profile.id); if (idx !== -1) appData.discoverProfiles.splice(idx, 1); saveUserData(currentSessionUser.id); renderCurrentTab(); }
    function sendMessage(partnerId, text) { if (!text.trim()) return; const match = appData.matchesList.find(m => m.id === partnerId); if (match) { match.chatMessages.push({ text, sender: "me", time: "now" }); match.lastMessage = text; saveUserData(currentSessionUser.id); renderChatScreen(partnerId); } }
    
    function renderChatScreen(partnerId) {
        const partner = appData.matchesList.find(m => m.id === partnerId); if (!partner) return;
        currentChatPartner = partner; const container = document.getElementById("appContent");
        let messagesHtml = ""; partner.chatMessages.forEach(msg => { messagesHtml += `<div class="msg-bubble ${msg.sender === 'me' ? 'msg-sent' : 'msg-received'}">${msg.sender === 'them' ? `<strong>${partner.name}</strong> ` : ''}${escapeHtml(msg.text)}</div>`; });
        container.innerHTML = `<div class="modern-card" style="padding:20px;"><div class="chat-header-match"><div style="width:54px;height:54px;border-radius:54px;overflow:hidden;"><img src="${photoUrl(partnerId)}" style="width:100%;height:100%;object-fit:cover;"></div><div><strong style="color:white;">${partner.name}, ${partner.age}</strong><br><span style="color:#f472b6;">${partner.matchPercentage}% match</span></div><i class="fas fa-arrow-left" id="backToMatchesBtn" style="margin-left:auto;color:#ec4899;font-size:24px;cursor:pointer;"></i></div><div class="messages-box" id="chatMessagesBox">${messagesHtml}</div><div class="chat-input-area"><input id="chatMessageInput" placeholder="Message..." style="flex:1;background:transparent;border:none;color:white;padding:12px;"><button id="sendChatBtn" style="background:#ec4899;border:none;width:46px;height:46px;border-radius:46px;color:white;"><i class="fas fa-paper-plane"></i></button></div></div>`;
        document.getElementById("backToMatchesBtn")?.addEventListener("click", () => { currentChatPartner = null; activeTab = "matches"; renderCurrentTab(); });
        document.getElementById("sendChatBtn")?.addEventListener("click", () => { const inp = document.getElementById("chatMessageInput"); if (inp.value.trim()) { sendMessage(partnerId, inp.value); inp.value = ""; setTimeout(() => document.getElementById("chatMessagesBox")?.scrollTo(0,99999),30); } });
        attachModernCardStyles();
    }
    
    function renderMatchesTab() {
        if (currentChatPartner) { renderChatScreen(currentChatPartner.id); return; }
        const container = document.getElementById("appContent");
        if (!appData.matchesList.length) { container.innerHTML = `<div class="modern-card" style="text-align:center;padding:60px 20px;"><i class="fas fa-heart-broken" style="font-size:52px;"></i><p>No matches yet. Start liking!</p></div>`; attachModernCardStyles(); return; }
        let html = `<h3 style="color:white;margin-bottom:18px;">Your Matches · ${appData.matchesList.length}</h3>`;
        appData.matchesList.forEach(m => { html += `<div class="modern-card match-item" style="margin-bottom:14px;"><div class="match-avatar"><img src="${photoUrl(m.id)}"></div><div class="match-info"><div class="match-name">${m.name}, ${m.age} <span class="match-percentage">${m.matchPercentage}%</span></div><div>${m.occupation}</div><div>💬 ${m.lastMessage.substring(0,35)}</div></div><button class="chat-btn" data-chatid="${m.id}">Chat</button></div>`; });
        container.innerHTML = html;
        document.querySelectorAll(".chat-btn").forEach(btn => btn.addEventListener("click", () => { const id = btn.getAttribute("data-chatid"); if (id) renderChatScreen(id); }));
        attachModernCardStyles();
    }
    
    let startX=0, currentX=0, isDragging=false;
    function attachSwipeEvents(card, profile) { if(!card) return; const onMove=(e)=>{if(!isDragging) return; const dx=(e.touches?e.touches[0].clientX:e.clientX)-startX; currentX=dx; card.style.transform=`translateX(${dx}px) rotate(${dx*0.03}deg)`; card.style.opacity=Math.max(0.5,1-Math.abs(dx)/400); }; const onEnd=()=>{if(!isDragging) return; isDragging=false; if(currentX>110) likeProfile(profile); else if(currentX<-110) passProfile(profile); else{card.style.transform=""; card.style.opacity="";} document.removeEventListener("mousemove",onMove); document.removeEventListener("mouseup",onEnd); }; const onStart=(e)=>{ if(e.target.closest('.action-btn')) return; isDragging=true; startX=e.touches?e.touches[0].clientX:e.clientX; currentX=0; document.addEventListener("mousemove",onMove); document.addEventListener("mouseup",onEnd); }; card.addEventListener("mousedown",onStart); card.addEventListener("touchstart",onStart,{passive:false}); }
    
    function renderDiscoverTab() {
        const container = document.getElementById("appContent");
        if(appData.discoverProfiles.length===0){ container.innerHTML=`<div class="modern-card" style="text-align:center;padding:40px;"><i class="fas fa-check-circle"></i><p>No more profiles! <button id="resetDiscoverBtn" class="reset-btn">Reset</button></p></div>`; document.getElementById("resetDiscoverBtn")?.addEventListener("click",()=>{ appData.discoverProfiles=[...DEFAULT_DISCOVER]; saveUserData(currentSessionUser.id); renderCurrentTab(); }); attachModernCardStyles(); return; }
        const profile=appData.discoverProfiles[0];
        container.innerHTML=`<div class="modern-card" id="draggableCard"><div class="profile-img"><div class="match-percent-badge"><i class="fas fa-chart-line"></i> ${profile.matchPercentage}%</div><img src="${photoUrl(profile.id)}"></div><div class="profile-info"><div class="profile-name">${profile.name}, ${profile.age}</div><div class="profile-occupation">${profile.occupation}</div><div class="profile-bio">${profile.bio}</div></div><div class="action-buttons"><button class="action-btn btn-pass" id="passBtn"><i class="fas fa-times"></i></button><button class="action-btn btn-super" id="superBtn"><i class="fas fa-star"></i></button><button class="action-btn btn-like" id="likeBtn"><i class="fas fa-heart"></i></button></div></div><div class="swipe-hint"><i class="fas fa-arrows-alt-h"></i> Swipe → like | ← pass | ⭐ SuperLike (50💎)</div>`;
        attachSwipeEvents(document.getElementById("draggableCard"), profile);
        document.getElementById("passBtn")?.addEventListener("click",()=>passProfile(profile));
        document.getElementById("likeBtn")?.addEventListener("click",()=>likeProfile(profile));
        document.getElementById("superBtn")?.addEventListener("click",()=>superLike(profile));
        attachModernCardStyles();
    }
    
    function renderProfileTab() {
        const user = currentSessionUser;
        const container = document.getElementById("appContent");
        container.innerHTML = `<div class="modern-card my-profile-card"><div class="user-profile-photo"><img src="${photoUrl('user_alex')}" id="profileAvatar"></div><h2 style="color:white;">${user.name}, ${user.age}</h2><p style="color:#b9b3d9;">📍 ${user.country}</p><p style="color:#cbc3f0;">${appData.currentUserBio || user.bio}</p><div><label class="upload-label"><i class="fas fa-camera"></i> Upload Photo <input type="file" id="profilePhotoFile" accept="image/*" style="display:none;"></label><button id="resetPhotoBtn" class="reset-photo-btn">Reset</button></div><div style="display:flex;justify-content:space-between;margin:20px 0;"><div><i class="fas fa-gem"></i> ${appData.userCoins} gems</div><div><i class="fas fa-heart"></i> ${appData.matchesList.length} matches</div></div><button id="dailyBonusBtn" style="background:linear-gradient(145deg,#f59e0b,#b45309);border:none;width:100%;padding:14px;border-radius:60px;color:white;">✨ Daily Bonus +50 Gems ✨</button><div>Edit Bio</div><input id="editBioInput" class="edit-field" value="${escapeHtml(appData.currentUserBio || user.bio)}"><button id="saveBioBtn" style="background:#ec4899;margin-top:12px;padding:12px;border-radius:60px;width:100%;color:white;">Save</button><div style="margin-top:16px;">Change Country</div><select id="editCountrySelect" class="edit-field">${countryList.map(c => `<option value="${c}" ${c === user.country ? 'selected' : ''}>${c}</option>`).join('')}</select><button id="saveCountryBtn" style="background:#ec4899;margin-top:8px;padding:10px;border-radius:60px;width:100%;color:white;">Update Country</button><button id="logoutBtn" style="background:#2e2a3e;border:1px solid #ec4899;margin-top:20px;padding:12px;border-radius:60px;color:white;">🚪 Logout</button></div>`;
        document.getElementById("profilePhotoFile")?.addEventListener("change",(e)=>{ if(e.target.files[0]){ const url=URL.createObjectURL(e.target.files[0]); appData.customUserPhotoURL=url; saveUserData(currentSessionUser.id); renderProfileTab(); showToast("Photo updated!","#ec4899"); } });
        document.getElementById("resetPhotoBtn")?.addEventListener("click",()=>{ appData.customUserPhotoURL=null; saveUserData(currentSessionUser.id); renderProfileTab(); showToast("Default photo restored","#f59e0b"); });
        document.getElementById("dailyBonusBtn")?.addEventListener("click",()=>{ appData.userCoins+=50; updateCoinUI(); saveUserData(currentSessionUser.id); renderProfileTab(); showToast("+50 gems!","#fbbf24"); });
        document.getElementById("saveBioBtn")?.addEventListener("click",()=>{ const newBio=document.getElementById("editBioInput").value; appData.currentUserBio=newBio; saveUserData(currentSessionUser.id); renderProfileTab(); showToast("Bio updated","#ec4899"); });
        document.getElementById("saveCountryBtn")?.addEventListener("click",()=>{ const newCountry=document.getElementById("editCountrySelect").value; currentSessionUser.country=newCountry; saveUsers(); saveSession(currentSessionUser); renderProfileTab(); showToast("Country updated","#ec4899"); });
        document.getElementById("logoutBtn")?.addEventListener("click",()=>{ 
            if(cameraEngineInstance) { cameraEngineInstance.stopStream(); cameraEngineInstance = null; }
            clearLiveInterval();
            clearSession(); 
            showAuthScreen(); 
        });
        attachModernCardStyles();
    }
    
    // Live Tab - fixed with professional cleanup and interval handling
    function renderLiveTab() {
        if (cameraEngineInstance) {
            cameraEngineInstance.stopStream();
            cameraEngineInstance = null;
        }
        clearLiveInterval();

        const container = document.getElementById("appContent");
        container.innerHTML = `<div class="modern-card" style="padding:20px;"><div class="live-video-wrapper"><video id="liveVideoElement" autoplay playsinline muted style="width:100%;border-radius:40px;transform:scaleX(-1);background:#000;"></video></div><div class="live-controls"><button id="startLiveBtn" class="live-btn"><i class="fas fa-play"></i> START LIVE</button><button id="stopLiveBtn" class="live-btn" style="background:#4a2e3a;"><i class="fas fa-stop"></i> STOP</button></div><div id="liveStatusMsg" class="viewers-sim" style="text-align:center;margin-top:12px;font-weight:500;">⚡ Ready to stream</div></div>`;
        
        const videoElement = document.getElementById("liveVideoElement");
        const startBtn = document.getElementById("startLiveBtn");
        const stopBtn = document.getElementById("stopLiveBtn");
        const statusSpan = document.getElementById("liveStatusMsg");

        startBtn.onclick = async () => {
            if (cameraEngineInstance && cameraEngineInstance.localStream) {
                showToast("Already live! Stop current stream first.", "#ec4899");
                return;
            }
            try {
                if (cameraEngineInstance) cameraEngineInstance.stopStream();
                cameraEngineInstance = new CameraEngine("liveVideoElement");
                await cameraEngineInstance.startStream();
                statusSpan.innerHTML = `<span style="background:#e11d48; padding:6px 14px; border-radius:60px;">🔴 LIVE · 14 viewers watching</span>`;
                showToast("🔴 You are live! Professional stream active", "#ec4899");
                let viewers = 14;
                clearLiveInterval();
                globalLiveViewerInterval = setInterval(() => {
                    if (cameraEngineInstance && cameraEngineInstance.localStream) {
                        viewers += Math.floor(Math.random() * 3);
                        statusSpan.innerHTML = `<span style="background:#e11d48; padding:6px 14px; border-radius:60px;">🔴 LIVE · ${viewers} watching</span>`;
                    } else {
                        clearLiveInterval();
                    }
                }, 5000);
            } catch (err) {
                statusSpan.innerHTML = "❌ Camera access denied — check permissions";
                showToast("Camera permission required for live video", "#ff4d4d");
            }
        };
        
        stopBtn.onclick = () => {
            if (cameraEngineInstance) {
                cameraEngineInstance.stopStream();
                cameraEngineInstance = null;
                clearLiveInterval();
                statusSpan.innerHTML = "⏹️ Stream ended — press Start to go live again";
                showToast("Live stream stopped", "#aaa");
            } else {
                showToast("No active live stream", "#aaa");
            }
        };
        attachModernCardStyles();
    }
    
    function renderCurrentTab() {
        if(activeTab==="discover") renderDiscoverTab();
        else if(activeTab==="matches") renderMatchesTab();
        else if(activeTab==="live") renderLiveTab();
        else if(activeTab==="profile") renderProfileTab();
        document.querySelectorAll(".nav-item").forEach(item=>item.classList.toggle("nav-active",item.getAttribute("data-tab")===activeTab));
        updateCoinUI();
    }
    
    function attachModernCardStyles() { if (window.uiEngineInstance) window.uiEngineInstance.observeCards(); }
    function showToast(msg,bg){ const t=document.createElement("div"); t.innerText=msg; Object.assign(t.style,{position:"fixed",bottom:"90px",left:"50%",transform:"translateX(-50%)",backgroundColor:bg,padding:"10px 20px",borderRadius:"60px",color:"white",zIndex:"999",backdropFilter:"blur(8px)"}); document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }
    function escapeHtml(str){ return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
    
    class UIEngine {
        constructor() { this.observer = null; this.initObserver(); this.initSpotlight(); }
        initObserver() { this.observer = new IntersectionObserver((entries) => { entries.forEach((entry, idx) => { if (entry.isIntersecting) { setTimeout(() => entry.target.classList.add('is-visible'), idx * 80); this.observer.unobserve(entry.target); } }); }, { threshold: 0.1 }); }
        initSpotlight() { const attach = (card) => { card.addEventListener('mousemove', (e) => { const rect = card.getBoundingClientRect(); card.style.setProperty('--mouse-x', `${e.clientX - rect.left}px`); card.style.setProperty('--mouse-y', `${e.clientY - rect.top}px`); }); }; document.querySelectorAll('.modern-card').forEach(attach); new MutationObserver((mutations) => { mutations.forEach((mutation) => { mutation.addedNodes.forEach((node) => { if (node.nodeType === 1 && node.matches && node.matches('.modern-card')) attach(node); else if (node.nodeType === 1 && node.querySelectorAll) node.querySelectorAll('.modern-card').forEach(attach); }); }); }).observe(document.body, { childList: true, subtree: true }); }
        observeCards() { document.querySelectorAll('.modern-card').forEach(card => this.observer?.observe(card)); }
    }
    
    function showAuthScreen() {
        if(cameraEngineInstance) { cameraEngineInstance.stopStream(); cameraEngineInstance = null; clearLiveInterval(); }
        const root = document.getElementById("root");
        root.innerHTML = `<div class="auth-container"><div class="auth-logo"><h1>FlameMatch</h1><p style="color:#c9c2f0;">Find your perfect flame 🔥</p></div><div id="authForm"><input type="email" id="authEmail" class="auth-input" placeholder="Email"><input type="password" id="authPassword" class="auth-input" placeholder="Password"><div id="authExtraFields" style="display:none;"><input type="text" id="authName" class="auth-input" placeholder="Full Name"><input type="number" id="authAge" class="auth-input" placeholder="Age (18-99)"><select id="authCountry" class="auth-select">${countryList.map(c => `<option value="${c}">${c}</option>`).join('')}</select></div><button id="authSubmitBtn" class="auth-btn">Login</button><div class="auth-switch">New here? <span id="toggleAuthMode">Create account</span></div><div id="authError" class="auth-error"></div></div></div>`;
        let isLogin = true; const extraDiv = document.getElementById("authExtraFields"); const submitBtn = document.getElementById("authSubmitBtn"); const toggle = document.getElementById("toggleAuthMode"); const errorDiv = document.getElementById("authError");
        const emailInp = document.getElementById("authEmail"), passInp = document.getElementById("authPassword");
        function setMode(login) { isLogin = login; extraDiv.style.display = login ? "none" : "block"; submitBtn.innerText = login ? "Login" : "Sign Up"; toggle.innerText = login ? "Create account" : "Back to Login"; }
        toggle.onclick = () => setMode(!isLogin);
        submitBtn.onclick = () => {
            const email = emailInp.value.trim(), password = passInp.value.trim();
            if (!email || !password) { errorDiv.innerText = "Email and password required"; return; }
            if (isLogin) {
                const result = login(email, password);
                if (result.success) { saveSession(result.user); loadUserData(result.user.id); initMainApp(); }
                else errorDiv.innerText = result.error;
            } else {
                const name = document.getElementById("authName")?.value.trim(), age = document.getElementById("authAge")?.value, country = document.getElementById("authCountry")?.value;
                if (!name || !age || age<18 || age>99) { errorDiv.innerText = "Valid name and age (18-99) required"; return; }
                const result = signup(email, password, name, age, country);
                if (result.success) { saveSession(result.user); loadUserData(result.user.id); initMainApp(); }
                else errorDiv.innerText = result.error;
            }
        };
    }
    
    function initMainApp() {
        const root = document.getElementById("root");
        root.innerHTML = `<div class="dating-app"><div class="main-header"><div class="logo-area"><h1>FlameMatch❤️‍🔥</h1></div><div class="coin-badge"><i class="fas fa-gem"></i> <span id="coinAmount">${appData.userCoins}</span></div></div><div class="content-area" id="appContent"></div><div class="bottom-nav"><div class="nav-item" data-tab="discover"><i class="fas fa-fire"></i><span>For You</span></div><div class="nav-item" data-tab="matches"><i class="fas fa-heart"></i><span>Matches</span></div><div class="nav-item" data-tab="live"><i class="fas fa-video"></i><span>Live</span></div><div class="nav-item" data-tab="profile"><i class="fas fa-user-astronaut"></i><span>Profile</span></div></div></div>`;
        activeTab = "discover"; currentChatPartner = null;
        renderCurrentTab();
        document.querySelectorAll(".nav-item").forEach(item => { item.addEventListener("click", () => { const tab = item.getAttribute("data-tab"); if (tab) { if (activeTab === "live" && tab !== "live" && cameraEngineInstance) { cameraEngineInstance.stopStream(); cameraEngineInstance = null; clearLiveInterval(); } activeTab = tab; currentChatPartner = null; renderCurrentTab(); } }); });
        updateCoinUI();
        window.uiEngineInstance = new UIEngine();
        attachModernCardStyles();
    }
    
    if (currentSessionUser) { loadUserData(currentSessionUser.id); initMainApp(); } else { showAuthScreen(); }
</script>
</body>
</html>
