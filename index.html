  <!-- Error fallback UI if modules fail -->
  <script>
    window.addEventListener('error', function(e) {
      if (e.message && (e.message.includes('Unexpected token') || e.message.includes('Failed to fetch'))) {
        const root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML = `
            <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:2rem;">
              <h2 style="color:#f43f5e;">⚠️ Loading Error</h2>
              <p style="margin-top:1rem;">Network issue or CDN blocked. Please refresh or try again later.</p>
              <button onclick="location.reload()" style="margin-top:2rem; background:#f43f5e; color:white; border:none; padding:0.75rem 1.5rem; border-radius:2rem; cursor:pointer;">Retry</button>
            </div>
          `;
        }
        e.preventDefault();
      }
    });
  </script>
</head>
<body class="antialiased">
  <div id="root"></div>

  <!-- Import Map: primary CDN = unpkg.com (highly available), fallback to skypack via dynamic resolver -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://unpkg.com/react@19.0.0/index.js",
        "react-dom/client": "https://unpkg.com/react-dom@19.0.0/client.js",
        "zustand": "https://unpkg.com/zustand@5.0.0/index.js",
        "framer-motion": "https://unpkg.com/framer-motion@11.11.11/dist/index.js",
        "lucide-react": "https://unpkg.com/lucide-react@0.460.0/dist/index.js"
      }
    }
  </script>

  <!-- Fallback mechanism: detect failed loads and switch to Skypack CDN -->
  <script>
    (function() {
      const fallbackMap = {
        'react': 'https://cdn.skypack.dev/react@19.0.0',
        'react-dom/client': 'https://cdn.skypack.dev/react-dom@19.0.0/client',
        'zustand': 'https://cdn.skypack.dev/zustand@5.0.0',
        'framer-motion': 'https://cdn.skypack.dev/framer-motion@11.11.11',
        'lucide-react': 'https://cdn.skypack.dev/lucide-react@0.460.0'
      };
      let failed = false;
      const observer = new PerformanceObserver((list) => {
        for (const entry of list.getEntries()) {
          if (entry.initiatorType === 'script' && entry.name && entry.name.includes('unpkg.com') && entry.responseStatus !== 200) {
            failed = true;
          }
        }
        if (failed) {
          const importMap = document.querySelector('script[type="importmap"]');
          if (importMap) {
            importMap.textContent = JSON.stringify({ imports: fallbackMap });
            console.warn('[LoveConnect] Unpkg failed — switched to Skypack fallback');
            // Re-trigger main module reload
            const mainModule = document.querySelector('#main-app-module');
            if (mainModule) {
              const newScript = document.createElement('script');
              newScript.type = 'module';
              newScript.id = 'main-app-module';
              newScript.textContent = mainModule.textContent;
              mainModule.remove();
              document.body.appendChild(newScript);
            }
          }
          observer.disconnect();
        }
      });
      observer.observe({ entryTypes: ['resource'] });
      setTimeout(() => observer.disconnect(), 4000);
    })();
  </script>

  <!-- Main Application Module (the entire React app) -->
  <script type="module" id="main-app-module">
    import React, { useState, useEffect, useRef, useCallback } from 'react';
    import ReactDOM from 'react-dom/client';
    import { create } from 'zustand';
    import { motion, useMotionValue, useTransform, AnimatePresence } from 'framer-motion';
    import {
      Heart, X, Star, MessageCircle, User, Settings, CreditCard, ShieldAlert,
      Sun, Moon, Sparkles, Check, Zap, Send, MoreHorizontal, MapPin, Briefcase,
      Flag, Ban, CheckCircle2, AlertTriangle, Users, BarChart3, ShieldCheck, ArrowLeft,
      Crown, Eye, Clock, ThumbsUp
    } from 'lucide-react';

    // ------------------------------------------------------------
    // MOCK DATA & STORAGE
    // ------------------------------------------------------------
    const SEED_PROFILES = [
      { id: 'p1', email: 'emma@example.com', name: 'Emma', age: 26, gender: 'Female', bio: 'Adventure seeker & coffee minimalist. Let\'s find hidden rooftops and talk about human-centered design.', interests: ['Travel', 'Photography', 'Hiking'], photos: ['https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=600&h=800&fit=crop'], city: 'Nairobi', verified: true, occupation: 'Product Designer', compatibility: 94 },
      { id: 'p2', email: 'james@example.com', name: 'James', age: 29, gender: 'Male', bio: 'Systems architect who climbs rocks and builds microservices. Let\'s swap playlists and training plans.', interests: ['Climbing', 'Coding', 'Basketball'], photos: ['https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=600&h=800&fit=crop'], city: 'Mombasa', verified: true, occupation: 'Lead Engineer', compatibility: 88 },
      { id: 'p3', name: 'Sophia', age: 24, gender: 'Female', bio: 'Classical pianist & plant whisperer. Deep conversations about art, life, and vegan desserts.', interests: ['Music', 'Painting', 'Yoga'], photos: ['https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600&h=800&fit=crop'], city: 'Nairobi', verified: true, occupation: 'Creative Director', compatibility: 91 },
      { id: 'p4', name: 'Liam', age: 31, gender: 'Male', bio: 'Chef & fermentation enthusiast. I\'ll cook you a meal worth remembering.', interests: ['Cooking', 'Wine', 'Travel'], photos: ['https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=600&h=800&fit=crop'], city: 'Kisumu', verified: false, occupation: 'Head Chef', compatibility: 76 },
      { id: 'p5', name: 'Mia', age: 27, gender: 'Female', bio: 'Travel journalist & author. Currently writing stories about hidden gems across Africa.', interests: ['Writing', 'Hiking', 'Photography'], photos: ['https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=600&h=800&fit=crop'], city: 'Nakuru', verified: false, occupation: 'Journalist', compatibility: 82 }
    ];

    const storage = {
      get: (key, fallback) => { try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch { return fallback; } },
      set: (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }
    };

    // ------------------------------------------------------------
    // ZUSTAND STORE
    // ------------------------------------------------------------
    const useStore = create((set, get) => ({
      user: storage.get('lc_user', null),
      token: storage.get('lc_token', null),
      darkMode: storage.get('lc_dark', false),
      adminMode: false,
      swipes: storage.get('lc_swipes', []),
      matches: storage.get('lc_matches', [
        { id: 'match_demo', users: ['p1', 'p2'], lastMessage: 'Really vibing your profile!', lastMessageAt: Date.now() - 1800000, conversationId: 'conv_demo' }
      ]),
      messages: storage.get('lc_messages', {
        'conv_demo': [
          { id: 'msg1', senderId: 'p2', content: 'Hey Emma! Love the travel photos ✈️', timestamp: Date.now() - 3600000, read: true },
          { id: 'msg2', senderId: 'p1', content: 'Thank you James! Are you into hiking as well?', timestamp: Date.now() - 1800000, read: false }
        ]
      }),
      reports: storage.get('lc_reports', []),
      blocked: storage.get('lc_blocks', []),
      subscription: storage.get('lc_sub', { plan: 'FREE', expiresAt: null }),

      login: (email, pwd) => {
        if (email === 'admin@loveconnect.com' && pwd === 'admin2025') {
          const adminUser = { id: 'admin_root', email, name: 'Super Admin', role: 'admin', verified: true };
          set({ user: adminUser, token: 'admin-token', adminMode: true });
          storage.set('lc_user', adminUser); storage.set('lc_token', 'admin-token');
          return true;
        }
        const matched = SEED_PROFILES.find(p => p.email?.toLowerCase() === email.toLowerCase());
        if (matched) {
          const regular = { ...matched, role: 'user' };
          set({ user: regular, token: 'user-token', adminMode: false });
          storage.set('lc_user', regular); storage.set('lc_token', 'user-token');
          return true;
        }
        return false;
      },
      logout: () => {
        set({ user: null, token: null, adminMode: false });
        localStorage.removeItem('lc_user'); localStorage.removeItem('lc_token');
      },
      exitAdmin: () => set({ adminMode: false }),
      toggleDark: () => set(state => {
        const next = !state.darkMode;
        storage.set('lc_dark', next);
        if (next) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        return { darkMode: next };
      }),
      swipeOnProfile: (targetId, swipeType) => {
        const { user, swipes, matches, messages, blocked } = get();
        if (!user || blocked.includes(targetId)) return null;
        const newSwipe = { userId: user.id, targetId, type: swipeType, ts: Date.now() };
        const updatedSwipes = [...swipes, newSwipe];
        set({ swipes: updatedSwipes });
        storage.set('lc_swipes', updatedSwipes);
        const reciprocal = swipes.find(s => s.userId === targetId && s.targetId === user.id && ['RIGHT', 'SUPER'].includes(s.type));
        if (reciprocal && (swipeType === 'RIGHT' || swipeType === 'SUPER')) {
          const matchId = 'match_' + Date.now();
          const convId = 'conv_' + Date.now();
          const newMatch = { id: matchId, users: [user.id, targetId], lastMessage: '✨ You matched! Start the conversation.', lastMessageAt: Date.now(), conversationId: convId };
          const updatedMatches = [...matches, newMatch];
          const updatedMessages = { ...messages, [convId]: [] };
          set({ matches: updatedMatches, messages: updatedMessages });
          storage.set('lc_matches', updatedMatches);
          storage.set('lc_messages', updatedMessages);
          return { match: true, matchId };
        }
        return { match: false };
      },
      sendMessage: (convId, text) => {
        const { user, messages, matches } = get();
        if (!text.trim()) return;
        const newMsg = { id: Date.now().toString(), senderId: user.id, content: text, timestamp: Date.now(), read: false };
        const convMsgs = messages[convId] || [];
        const updatedMsgs = { ...messages, [convId]: [...convMsgs, newMsg] };
        const updatedMatches = matches.map(m => m.conversationId === convId ? { ...m, lastMessage: text, lastMessageAt: Date.now() } : m);
        set({ messages: updatedMsgs, matches: updatedMatches });
        storage.set('lc_messages', updatedMsgs);
        storage.set('lc_matches', updatedMatches);
        setTimeout(() => {
          const cs = get();
          const targetMatch = cs.matches.find(m => m.conversationId === convId);
          if (!targetMatch) return;
          const otherUserId = targetMatch.users.find(id => id !== user.id);
          const otherProfile = SEED_PROFILES.find(p => p.id === otherUserId);
          const replyText = `${otherProfile?.name || 'Match'}: "Hey! So glad we matched. What's your favourite weekend escape?"`;
          const autoReplyMsg = { id: 'auto_' + Date.now(), senderId: otherUserId, content: replyText, timestamp: Date.now(), read: false };
          const finalMessages = { ...cs.messages, [convId]: [...(cs.messages[convId] || []), autoReplyMsg] };
          const finalMatches = cs.matches.map(m => m.conversationId === convId ? { ...m, lastMessage: replyText, lastMessageAt: Date.now() } : m);
          set({ messages: finalMessages, matches: finalMatches });
          storage.set('lc_messages', finalMessages);
          storage.set('lc_matches', finalMatches);
        }, 2000);
      },
      markConversationRead: (convId) => {
        const { messages, user } = get();
        const conv = messages[convId];
        if (!conv) return;
        const updated = conv.map(m => m.senderId !== user.id ? { ...m, read: true } : m);
        const newMessages = { ...messages, [convId]: updated };
        set({ messages: newMessages });
        storage.set('lc_messages', newMessages);
      },
      upgradePlan: (planId) => {
        const newSub = { plan: planId, expiresAt: new Date(Date.now() + 30 * 86400000).toISOString() };
        set({ subscription: newSub });
        storage.set('lc_sub', newSub);
      },
      reportUser: (reportedId, reason) => {
        const { reports, user } = get();
        const newReport = { id: `rep_${Date.now()}`, reporterId: user.id, reportedId, reason, date: Date.now(), status: 'PENDING' };
        const updated = [...reports, newReport];
        set({ reports: updated });
        storage.set('lc_reports', updated);
      },
      blockUser: (blockId) => {
        const { blocked } = get();
        if (!blocked.includes(blockId)) {
          const updated = [...blocked, blockId];
          set({ blocked: updated });
          storage.set('lc_blocks', updated);
        }
      },
      resolveReport: (reportId) => {
        const { reports } = get();
        const updated = reports.map(r => r.id === reportId ? { ...r, status: 'RESOLVED' } : r);
        set({ reports: updated });
        storage.set('lc_reports', updated);
      }
    }));

    // ------------------------------------------------------------
    // SWIPE CARD COMPONENT
    // ------------------------------------------------------------
    const SwipeCard = ({ profile, onSwipeAction }) => {
      const x = useMotionValue(0);
      const y = useMotionValue(0);
      const rotate = useTransform(x, [-200, 200], [-20, 20]);
      const opacityRight = useTransform(x, [30, 150], [0, 1]);
      const opacityLeft = useTransform(x, [-150, -30], [1, 0]);
      const opacitySuper = useTransform(y, [-150, -30], [1, 0]);
      const [gone, setGone] = useState(false);
      const [exitDir, setExitDir] = useState({ x: 0, y: 0 });

      const handleDragEnd = async (e, info) => {
        const ox = info.offset.x;
        const oy = info.offset.y;
        if (ox > 120) {
          setExitDir({ x: 600, y: ox * 0.1 });
          setGone(true);
          onSwipeAction('RIGHT');
        } else if (ox < -120) {
          setExitDir({ x: -600, y: ox * -0.1 });
          setGone(true);
          onSwipeAction('LEFT');
        } else if (oy < -100) {
          setExitDir({ x: 0, y: -700 });
          setGone(true);
          onSwipeAction('SUPER');
        }
      };

      return (
        <motion.div
          style={{ x, y, rotate }}
          drag={!gone}
          onDragEnd={handleDragEnd}
          animate={gone ? { x: exitDir.x, y: exitDir.y, opacity: 0, transition: { duration: 0.35 } } : {}}
          whileTap={!gone ? { cursor: 'grabbing' } : {}}
          className="absolute w-full max-w-md h-[540px] bg-white dark:bg-gray-900 rounded-3xl shadow-2xl overflow-hidden select-none"
        >
          <img src={profile.photos[0]} className="w-full h-full object-cover pointer-events-none" alt={profile.name} draggable="false" />
          <div className="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/85 via-black/40 to-transparent p-5 text-white">
            <div className="flex items-center gap-2 flex-wrap">
              <h2 className="text-2xl font-bold">{profile.name}, {profile.age}</h2>
              {profile.verified && <CheckCircle2 size={18} className="text-rose-400" />}
              <span className="ml-auto bg-rose-500/80 text-xs px-2 py-1 rounded-full font-semibold">{profile.compatibility}% Match</span>
            </div>
            <div className="flex gap-3 text-sm mt-1 items-center">
              <Briefcase size={14}/> {profile.occupation}
              <MapPin size={14}/> {profile.city}
            </div>
            <p className="text-sm mt-2 line-clamp-2 leading-relaxed">{profile.bio}</p>
            <div className="flex gap-2 mt-3 flex-wrap">
              {profile.interests.slice(0, 3).map(i => <span key={i} className="bg-white/20 text-xs px-3 py-1 rounded-full">{i}</span>)}
            </div>
          </div>
          <motion.div style={{ opacity: opacityRight }} className="absolute top-8 left-5 border-4 border-green-400 text-green-400 font-black text-2xl px-3 py-1 rounded-xl -rotate-12 bg-green-500/10 pointer-events-none">LIKE</motion.div>
          <motion.div style={{ opacity: opacityLeft }} className="absolute top-8 right-5 border-4 border-red-500 text-red-500 font-black text-2xl px-3 py-1 rounded-xl rotate-12 bg-red-500/10 pointer-events-none">NOPE</motion.div>
          <motion.div style={{ opacity: opacitySuper }} className="absolute bottom-36 left-1/2 -translate-x-1/2 border-4 border-cyan-400 text-cyan-400 text-xl px-6 py-1 rounded-full bg-cyan-400/10 pointer-events-none">⭐ SUPER</motion.div>
        </motion.div>
      );
    };

    // ------------------------------------------------------------
    // DISCOVERY FEED, CHAT, MATCHES, PREMIUM, ADMIN, SETTINGS (condensed but functional)
    // For brevity, we reuse the exact same logic as original. I'll embed minimal but complete versions.
    // The full original app logic is kept but with corrected component naming.
    // ------------------------------------------------------------
    const DiscoveryFeed = () => {
      const { user, swipes, swipeOnProfile, subscription, blocked } = useStore();
      const [candidates, setCandidates] = useState([]);
      const [currentIdx, setCurrentIdx] = useState(0);
      const isPremium = subscription.plan !== 'FREE';
      useEffect(() => {
        let available = SEED_PROFILES.filter(p => p.id !== user?.id && !blocked.includes(p.id));
        const swipedIds = swipes.filter(s => s.userId === user?.id).map(s => s.targetId);
        available = available.filter(p => !swipedIds.includes(p.id));
        setCandidates(available);
        setCurrentIdx(0);
      }, [user, blocked, swipes]);
      const handleSwipeDecision = useCallback((type) => {
        if (currentIdx >= candidates.length) return;
        const target = candidates[currentIdx];
        swipeOnProfile(target.id, type);
        setCurrentIdx(prev => prev + 1);
      }, [currentIdx, candidates, swipeOnProfile]);
      const profile = candidates[currentIdx];
      if (!profile) {
        return (
          <div className="flex flex-col items-center justify-center h-[70vh] text-center px-6">
            <Heart size={56} className="text-rose-400 mb-4 animate-pulse" />
            <h3 className="text-xl font-bold">You've seen everyone nearby</h3>
            <p className="text-gray-500 mt-1 text-sm">Check back later or broaden your filters</p>
            {!isPremium && <div className="mt-6 bg-amber-100 dark:bg-amber-900/30 px-4 py-3 rounded-xl text-sm flex items-center gap-2"><Crown size={18} className="text-amber-500"/> Upgrade Premium to see who liked you</div>}
          </div>
        );
      }
      return (
        <div className="relative flex flex-col items-center">
          <div className="relative w-full max-w-md h-[540px]">
            {candidates[currentIdx + 1] && (
              <div className="absolute inset-0 max-w-md h-[540px] rounded-3xl overflow-hidden scale-[0.96] translate-y-2 opacity-60 pointer-events-none">
                <img src={candidates[currentIdx + 1].photos[0]} className="w-full h-full object-cover" alt="" />
              </div>
            )}
            <AnimatePresence>
              <SwipeCard key={profile.id} profile={profile} onSwipeAction={handleSwipeDecision} />
            </AnimatePresence>
          </div>
          <div className="flex gap-5 mt-8 z-20">
            <button onClick={() => handleSwipeDecision('LEFT')} className="bg-red-100 dark:bg-red-950/60 p-4 rounded-full text-red-500 shadow-lg hover:scale-105 active:scale-95 transition"><X size={28} /></button>
            <button onClick={() => handleSwipeDecision('SUPER')} className="bg-blue-100 dark:bg-blue-950/60 p-4 rounded-full text-blue-500 shadow-lg hover:scale-105 active:scale-95 transition"><Star size={28} /></button>
            <button onClick={() => handleSwipeDecision('RIGHT')} className="bg-green-100 dark:bg-green-950/60 p-4 rounded-full text-green-500 shadow-lg hover:scale-105 active:scale-95 transition"><Heart size={28} /></button>
          </div>
        </div>
      );
    };

    const ChatRoom = ({ conversationId, matchName, matchPhoto, onBack }) => {
      const { user, messages, sendMessage, markConversationRead } = useStore();
      const [text, setText] = useState('');
      const msgs = messages[conversationId] || [];
      const bottomRef = useRef(null);
      useEffect(() => { markConversationRead(conversationId); }, [conversationId]);
      useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [msgs.length]);
      const handleSend = () => { if (text.trim()) { sendMessage(conversationId, text); setText(''); } };
      const handleKeyDown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } };
      return (
        <div className="flex flex-col h-[75vh] bg-white dark:bg-gray-950 rounded-2xl shadow-lg overflow-hidden">
          <div className="flex items-center gap-3 p-3 border-b dark:border-gray-800 bg-white dark:bg-gray-950 shrink-0">
            <button onClick={onBack} className="p-1 text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/30 rounded-full"><ArrowLeft size={22} /></button>
            {matchPhoto && <img src={matchPhoto} className="w-9 h-9 rounded-full object-cover" alt={matchName} />}
            <div><p className="font-bold text-sm">{matchName || 'Chat'}</p><p className="text-xs text-green-500">Online</p></div>
          </div>
          <div className="flex-1 overflow-y-auto p-4 space-y-3 no-scrollbar">
            {msgs.length === 0 && <div className="text-center py-8 text-gray-400 text-sm">Say hello — you matched! 👋</div>}
            {msgs.map(m => (
              <div key={m.id} className={`flex ${m.senderId === user?.id ? 'justify-end' : 'justify-start'}`}>
                <div className={`max-w-[78%] rounded-2xl px-4 py-2.5 text-sm leading-relaxed ${m.senderId === user?.id ? 'bg-rose-500 text-white rounded-br-sm' : 'bg-gray-100 dark:bg-gray-800 rounded-bl-sm'}`}>
                  {m.content}
                  <div className="text-[10px] opacity-50 mt-1 text-right">{new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
                </div>
              </div>
            ))}
            <div ref={bottomRef} />
          </div>
          <div className="p-3 border-t dark:border-gray-800 flex gap-2 shrink-0">
            <input className="flex-1 bg-gray-100 dark:bg-gray-800 rounded-full px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-rose-300" value={text} onChange={e => setText(e.target.value)} onKeyDown={handleKeyDown} placeholder="Type a message..." />
            <button onClick={handleSend} disabled={!text.trim()} className="bg-rose-500 p-2.5 rounded-full text-white hover:bg-rose-600 disabled:opacity-40"><Send size={18} /></button>
          </div>
        </div>
      );
    };

    const MatchesGallery = ({ onOpenChat }) => {
      const { user, matches, messages } = useStore();
      const userMatches = matches.filter(m => m.users.includes(user?.id));
      const getUnreadCount = (convId) => (messages[convId] || []).filter(m => m.senderId !== user?.id && !m.read).length;
      return (
        <div className="space-y-4">
          <h2 className="text-2xl font-bold">✨ Connections</h2>
          {userMatches.length === 0 && <div className="text-center py-16 text-gray-400"><Heart size={40} className="mx-auto mb-3 opacity-40" /><p>Swipe right to find your first match</p></div>}
          {userMatches.map(m => {
            const otherId = m.users.find(id => id !== user?.id);
            const other = SEED_PROFILES.find(p => p.id === otherId);
            const unread = getUnreadCount(m.conversationId);
            return (
              <button key={m.id} onClick={() => onOpenChat(m.conversationId, other)} className="w-full flex items-center gap-4 p-3 rounded-2xl bg-white dark:bg-gray-900 shadow-sm hover:shadow-md active:scale-[0.99] transition text-left">
                <div className="relative shrink-0"><img src={other?.photos[0] || 'https://ui-avatars.com/api/?name=User'} className="w-14 h-14 rounded-full object-cover" alt={other?.name} />{other?.verified && <span className="absolute -bottom-0.5 -right-0.5 bg-white dark:bg-gray-900 rounded-full p-0.5"><CheckCircle2 size={14} className="text-rose-500" /></span>}</div>
                <div className="flex-1 min-w-0"><p className="font-bold">{other?.name || 'User'}</p><p className="text-sm text-gray-500 truncate">{m.lastMessage}</p></div>
                {unread > 0 && <span className="bg-rose-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center shrink-0">{unread}</span>}
              </button>
            );
          })}
        </div>
      );
    };

    const SubscriptionPlaza = () => {
      const { subscription, upgradePlan } = useStore();
      const plans = [
        { id: 'FREE', name: 'Free', price: 'KES 0', features: ['Basic discovery', 'Standard messaging', '5 swipes/hour'] },
        { id: 'PREMIUM', name: 'Premium', price: 'KES 1,999', features: ['Unlimited swipes', 'See who liked you', 'Advanced filters', 'Priority visibility'], popular: true },
        { id: 'PREMIUM_PLUS', name: 'Premium+', price: 'KES 3,499', features: ['All Premium perks', 'Travel mode', 'Read receipts', 'Profile boost x3'] }
      ];
      return (
        <div>
          <h2 className="text-2xl font-bold mb-1 flex items-center gap-2"><Crown className="text-amber-500"/> Elevate Experience</h2>
          <p className="text-gray-500 text-sm mb-5">Unlock meaningful connections</p>
          <div className="grid gap-4">
            {plans.map(p => {
              const isCurrent = subscription.plan === p.id;
              return (
                <div key={p.id} className={`rounded-2xl p-5 border-2 relative transition-all ${isCurrent ? 'border-rose-500 bg-rose-50 dark:bg-rose-950/20' : p.popular ? 'border-rose-300 dark:border-rose-700' : 'border-gray-200 dark:border-gray-800'}`}>
                  {p.popular && !isCurrent && <span className="absolute -top-3 left-4 bg-rose-500 text-white text-xs px-3 py-0.5 rounded-full font-semibold">Most Popular</span>}
                  <h3 className="text-xl font-bold">{p.name}</h3>
                  <p className="text-3xl font-black mt-1">{p.price}<span className="text-sm font-normal text-gray-500">/month</span></p>
                  <ul className="my-4 space-y-2">{p.features.map(f => <li key={f} className="flex items-center gap-2 text-sm"><Check size={15} className="text-rose-500 shrink-0"/>{f}</li>)}</ul>
                  <button onClick={() => upgradePlan(p.id)} className={`w-full py-2.5 rounded-full font-semibold transition ${isCurrent ? 'bg-gray-200 dark:bg-gray-700 text-gray-500 cursor-default' : 'bg-rose-500 text-white hover:bg-rose-600'}`} disabled={isCurrent}>{isCurrent ? '✓ Current Plan' : `Get ${p.name}`}</button>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    const AdminControlRoom = ({ onExit }) => {
      const { reports, resolveReport, matches } = useStore();
      const pendingReports = reports.filter(r => r.status === 'PENDING');
      return (
        <div className="min-h-screen bg-gray-950 text-white p-6">
          <div className="flex justify-between items-center mb-8"><h1 className="text-3xl font-bold flex items-center gap-2"><ShieldCheck /> Admin Cortex</h1><button onClick={onExit} className="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-xl text-sm transition">Exit Console</button></div>
          <div className="grid md:grid-cols-3 gap-6 mb-8">
            {[{ icon: <Users size={28}/>, value: SEED_PROFILES.length + 1, label: 'Total Users' }, { icon: <BarChart3 size={28}/>, value: matches.length, label: 'Active Connections' }, { icon: <AlertTriangle size={28}/>, value: pendingReports.length, label: 'Pending Moderation' }].map((stat, i) => (
              <div key={i} className="bg-gray-900 p-5 rounded-2xl space-y-1">{stat.icon}<p className="text-3xl font-bold">{stat.value}</p><p className="text-gray-400 text-sm">{stat.label}</p></div>
            ))}
          </div>
          <div className="bg-gray-900 rounded-2xl p-5"><h2 className="text-xl font-semibold mb-4">🛡️ Reports & Safety</h2>{reports.length === 0 ? <p className="text-gray-400">No reports filed</p> : reports.map(r => (
            <div key={r.id} className="border-b border-gray-800 py-4 flex justify-between items-start gap-4"><div><p className="font-medium">Reported: <span className="text-rose-400">{r.reportedId}</span></p><p className="text-sm text-gray-400 mt-0.5">Reason: {r.reason}</p><span className={`text-xs mt-1 inline-block px-2 py-0.5 rounded-full ${r.status === 'RESOLVED' ? 'bg-green-800 text-green-300' : 'bg-yellow-800 text-yellow-300'}`}>{r.status}</span></div>{r.status === 'PENDING' && <button onClick={() => resolveReport(r.id)} className="bg-green-600 hover:bg-green-700 px-4 py-1.5 rounded-xl text-sm transition">Resolve</button>}</div>
          ))}</div>
        </div>
      );
    };

    const ProfileSettingsPanel = () => {
      const { user, reportUser, blockUser } = useStore();
      const [reportId, setReportId] = useState('');
      const [reportReason, setReportReason] = useState('Inappropriate content');
      const [blockId, setBlockId] = useState('');
      const [feedback, setFeedback] = useState('');
      const handleReport = () => { if (reportId.trim()) { reportUser(reportId.trim(), reportReason); setReportId(''); setFeedback('Report submitted.'); setTimeout(() => setFeedback(''), 3000); } };
      const handleBlock = () => { if (blockId.trim()) { blockUser(blockId.trim()); setBlockId(''); setFeedback('User blocked.'); setTimeout(() => setFeedback(''), 3000); } };
      return (
        <div className="space-y-5">
          <div className="bg-white dark:bg-gray-900 rounded-2xl p-5 shadow-sm"><div className="flex items-center gap-4"><div className="w-16 h-16 rounded-full bg-rose-100 dark:bg-rose-950/40 flex items-center justify-center text-2xl font-bold text-rose-500">{user?.name?.[0] || '?'}</div><div><h2 className="font-bold text-xl">{user?.name}</h2><p className="text-gray-500 text-sm">{user?.email}</p>{user?.verified && <span className="text-xs text-green-600 flex items-center gap-1 mt-1"><CheckCircle2 size={12}/> Verified</span>}</div></div></div>
          <div className="bg-white dark:bg-gray-900 rounded-2xl p-5 shadow-sm space-y-4"><h3 className="font-semibold flex items-center gap-2"><ShieldAlert size={16} className="text-rose-500"/> Safety Tools</h3>{feedback && <div className="bg-green-50 dark:bg-green-900/30 text-green-700 dark:text-green-300 text-sm px-3 py-2 rounded-xl">{feedback}</div>}<div className="space-y-2"><p className="text-sm font-medium">Report a user</p><input className="w-full bg-gray-100 dark:bg-gray-800 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-rose-300" placeholder="User ID (e.g. p3)" value={reportId} onChange={e => setReportId(e.target.value)} /><select className="w-full bg-gray-100 dark:bg-gray-800 rounded-xl px-3 py-2 text-sm" value={reportReason} onChange={e => setReportReason(e.target.value)}><option>Inappropriate content</option><option>Fake profile</option><option>Harassment</option><option>Spam</option></select><button onClick={handleReport} disabled={!reportId.trim()} className="flex items-center gap-2 bg-red-100 dark:bg-red-950/40 text-red-600 px-4 py-2 rounded-xl text-sm font-medium hover:bg-red-200 disabled:opacity-40"><Flag size={15}/> Submit Report</button></div><div className="space-y-2 pt-2 border-t dark:border-gray-800"><p className="text-sm font-medium">Block a user</p><input className="w-full bg-gray-100 dark:bg-gray-800 rounded-xl px-3 py-2 text-sm" placeholder="User ID to block" value={blockId} onChange={e => setBlockId(e.target.value)} /><button onClick={handleBlock} disabled={!blockId.trim()} className="flex items-center gap-2 bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-300 px-4 py-2 rounded-xl text-sm font-medium hover:bg-gray-300 disabled:opacity-40"><Ban size={15}/> Block User</button></div></div>
          <div className="bg-amber-50 dark:bg-amber-950/30 p-4 rounded-2xl"><h3 className="font-semibold flex items-center gap-2 mb-1"><Eye size={16}/> Privacy Hub</h3><p className="text-sm text-gray-600 dark:text-gray-400">Manage who sees your profile and control your data preferences.</p></div>
        </div>
      );
    };

    const AuthPage = () => {
      const [email, setEmail] = useState('');
      const [pass, setPass] = useState('');
      const [error, setError] = useState('');
      const { login } = useStore();
      const handleSubmit = (e) => { e.preventDefault(); setError(''); const ok = login(email.trim(), pass); if (!ok) setError('Try: emma@example.com (any password) or admin@loveconnect.com / admin2025'); };
      return (
        <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-rose-100 via-pink-50 to-white dark:from-gray-900 dark:to-gray-800">
          <div className="w-full max-w-md bg-white/80 dark:bg-gray-950/80 backdrop-blur-lg rounded-3xl shadow-2xl p-8"><div className="text-center mb-6"><h2 className="text-3xl font-black text-rose-600">LoveConnect</h2><p className="text-gray-500 text-sm mt-1">Modern Dating Ecosystem</p></div><form onSubmit={handleSubmit} className="space-y-4"><input type="email" className="w-full border dark:border-gray-700 rounded-xl p-3 bg-white dark:bg-gray-800 outline-none focus:ring-2 focus:ring-rose-300 text-sm" placeholder="Email address" value={email} onChange={e => setEmail(e.target.value)} required autoComplete="email" /><input type="password" className="w-full border dark:border-gray-700 rounded-xl p-3 bg-white dark:bg-gray-800 outline-none focus:ring-2 focus:ring-rose-300 text-sm" placeholder="Password" value={pass} onChange={e => setPass(e.target.value)} autoComplete="current-password" />{error && <p className="text-xs text-rose-500 bg-rose-50 dark:bg-rose-950/30 p-2 rounded-lg">{error}</p>}<button type="submit" className="w-full bg-rose-500 hover:bg-rose-600 text-white py-3 rounded-xl font-bold transition">Continue →</button></form><div className="text-xs text-center mt-6 text-gray-400 space-y-1"><p>Demo accounts:</p><p className="font-mono bg-gray-100 dark:bg-gray-800 rounded px-2 py-1">emma@example.com · any password</p><p className="font-mono bg-gray-100 dark:bg-gray-800 rounded px-2 py-1">admin@loveconnect.com · admin2025</p></div></div>
        </div>
      );
    };

    const AppShell = () => {
      const { user, darkMode, toggleDark, logout, adminMode, subscription, exitAdmin } = useStore();
      const [activeTab, setActiveTab] = useState('discover');
      const [activeChatId, setActiveChatId] = useState(null);
      const [activeChatMeta, setActiveChatMeta] = useState(null);
      useEffect(() => { if (darkMode) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark'); }, [darkMode]);
      if (!user) return React.createElement(AuthPage);
      if (adminMode && user.role === 'admin') return React.createElement(AdminControlRoom, { onExit: exitAdmin });
      const handleOpenChat = (convId, other) => { setActiveChatId(convId); setActiveChatMeta(other); };
      const handleCloseChat = () => { setActiveChatId(null); setActiveChatMeta(null); };
      const renderBody = () => {
        if (activeChatId) return React.createElement(ChatRoom, { conversationId: activeChatId, matchName: activeChatMeta?.name, matchPhoto: activeChatMeta?.photos?.[0], onBack: handleCloseChat });
        if (activeTab === 'discover') return React.createElement(DiscoveryFeed);
        if (activeTab === 'matches') return React.createElement(MatchesGallery, { onOpenChat: handleOpenChat });
        if (activeTab === 'premium') return React.createElement(SubscriptionPlaza);
        if (activeTab === 'settings') return React.createElement(ProfileSettingsPanel);
        return React.createElement(DiscoveryFeed);
      };
      const tabs = [{ id: 'discover', icon: React.createElement(Heart, { size: 22 }), label: 'Discover' }, { id: 'matches', icon: React.createElement(MessageCircle, { size: 22 }), label: 'Matches' }, { id: 'premium', icon: subscription.plan !== 'FREE' ? React.createElement(Crown, { size: 22, className: "text-amber-500" }) : React.createElement(Zap, { size: 22 }), label: 'Premium' }, { id: 'settings', icon: React.createElement(User, { size: 22 }), label: 'Profile' }];
      return React.createElement('div', { className: "min-h-screen pb-24 bg-gray-50 dark:bg-gray-950 transition-colors duration-300" },
        React.createElement('header', { className: "sticky top-0 backdrop-blur-lg bg-white/80 dark:bg-gray-950/80 z-30 px-4 py-3 flex justify-between items-center border-b border-gray-100 dark:border-gray-800" },
          React.createElement('h1', { className: "text-xl font-extrabold bg-gradient-to-r from-rose-500 to-pink-500 bg-clip-text text-transparent" }, "LoveConnect"),
          React.createElement('div', { className: "flex items-center gap-2" },
            React.createElement('button', { onClick: toggleDark, className: "p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition" }, darkMode ? React.createElement(Sun, { size: 20 }) : React.createElement(Moon, { size: 20 })),
            React.createElement('button', { onClick: logout, className: "text-sm text-rose-500 hover:text-rose-700 font-medium px-2 py-1 rounded-lg hover:bg-rose-50 dark:hover:bg-rose-950/30 transition" }, "Logout")
          )
        ),
        React.createElement('main', { className: "max-w-lg mx-auto px-4 pt-4" }, renderBody()),
        !activeChatId && React.createElement('nav', { className: "fixed bottom-0 left-0 right-0 bg-white/95 dark:bg-gray-900/95 backdrop-blur-xl border-t border-gray-100 dark:border-gray-800 flex justify-around py-2 z-20" }, tabs.map(t => React.createElement('button', { key: t.id, onClick: () => { setActiveTab(t.id); setActiveChatId(null); }, className: `flex flex-col items-center text-xs px-3 py-1 rounded-xl transition-colors ${activeTab === t.id ? 'text-rose-500' : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-300'}` }, t.icon, React.createElement('span', { className: "mt-0.5" }, t.label))))
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(AppShell));
  </script>
</body>
</html>
