<!DOCTYPE html>

        .main-header { padding: 12px 20px; display: flex; justify-content: space-between; background: rgba(10,10,18,0.8); backdrop-filter: blur(16px); border-bottom: 1px solid var(--panel-border); }

        .modern-card.is-visible { opacity: 1; transform: translateY(0); }

        .match-avatar { width: 58px; height: 58px; border-radius: 58px; overflow: hidden; border: 2px solid #ec4899; }

        .live-container video { width: 100%; border-radius: 40px; transform: scaleX(-1); background: #000; }
        .live-controls { display: flex; gap: 20px; justify-content: center; padding: 20px; }
        .live-btn { background: linear-gradient(145deg,#ec4899,#a21caf); border: none; padding: 12px 24px; border-radius: 60px; color: white; font-weight: bold; cursor: pointer; }
        .my-profile-card { text-align: center; padding: 28px 24px; }

        .bottom-nav { background: rgba(8,8,14,0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--panel-border); display: flex; justify-content: space-around; padding: 10px 12px 20px; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #6f6b8a; cursor: pointer; font-size: 11px; font-weight: 600; }
        .nav-active { color: #f472b6; text-shadow: 0 0 8px #ec4899; }
        .reset-btn { background: rgba(236,72,153,0.2); border: 1px solid #ec4899; padding: 12px; border-radius: 40px; width: 100%; color: white; cursor: pointer; }
        .swipe-hint { text-align: center; font-size: 11px; margin-top: 12px; color: #aa99e6; }

<body>
<div id="root"></div>

<script>
    // ----------------------------------- PROFESSIONAL CAMERA ENGINE WITH FULL DEBUGGING -----------------------------------
    class CameraEngine {
        constructor(videoElementId) {
            this.videoElement = document.getElementById(videoElementId);
            this.localStream = null;
            this.isStreaming = false;
            this.currentConstraints = null;
            this.debugLogs = [];

            if (!this.videoElement) {
                throw new Error(`Critical: Video element with ID "${videoElementId}" not found in DOM.`);
            }
            this.log("CameraEngine instantiated", { elementId: videoElementId });
        }

        log(message, data = null) {
            const logEntry = `[CameraEngine] ${message} ${data ? JSON.stringify(data) : ''}`;
            console.log(logEntry);
            this.debugLogs.push(logEntry);
        }

        error(message, errorObj = null) {
            console.error(`[CameraEngine ERROR] ${message}`, errorObj);
            this.debugLogs.push(`ERROR: ${message} ${errorObj ? errorObj.message : ''}`);
        }

        async enumerateDevices() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
                this.error("enumerateDevices not supported");
                return [];
            }
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');
                this.log("Enumerated video devices", videoDevices.map(d => ({ label: d.label, deviceId: d.deviceId })));
                return videoDevices;
            } catch (err) {
                this.error("Failed to enumerate devices", err);
                return [];
            }
        }

        async checkPermissionState() {
            if (!navigator.permissions || !navigator.permissions.query) {
                this.log("Permissions API not supported, cannot pre-check");
                return "unknown";
            }
            try {
                const permissionStatus = await navigator.permissions.query({ name: 'camera' });
                this.log(`Camera permission state: ${permissionStatus.state}`);
                permissionStatus.onchange = () => {
                    this.log(`Permission state changed to: ${permissionStatus.state}`);
                };
                return permissionStatus.state;
            } catch (err) {
                this.error("Permission query failed", err);
                return "unknown";
            }
        }

        // Constraint fallback strategy: try ideal, then basic, then minimal
        getConstraintVariants() {
            return [
                // Variant 1: Optimal (high quality)
                {
                    audio: { echoCancellation: true, noiseSuppression: true },
                    video: { width: { ideal: 1280, max: 1920 }, height: { ideal: 720, max: 1080 }, aspectRatio: 1.777777778, frameRate: { ideal: 30 }, facingMode: "user" }
                },
                // Variant 2: Standard (720p)
                {
                    audio: true,
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" }
                },
                // Variant 3: Minimal (480p) - works on almost all devices
                {
                    audio: true,
                    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" }
                },
                // Variant 4: Fallback - just video true
                {
                    video: true,
                    audio: true
                }
            ];
        }

        async startStream() {
            // Cleanup any existing stream first
            if (this.localStream) {
                this.log("Existing stream detected, stopping before restart");
                this.stopStream();
            }

            // Pre-flight checks
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                const errorMsg = "MediaDevices API not available. Ensure HTTPS or localhost, and browser support.";
                this.error(errorMsg);
                throw new Error(errorMsg);
            }

            // Check HTTPS (required for getUserMedia in production)
            if (location.protocol !== 'https:' && location.hostname !== 'localhost' && !location.hostname.includes('127.0.0.1')) {
                this.error("Application not served over HTTPS. getUserMedia may be blocked.");
                // Show warning but continue (some browsers still allow)
            }

            // Log permission state
            const permState = await this.checkPermissionState();
            this.log(`Permission pre-check: ${permState}`);

            // Enumerate devices for diagnostics
            const devices = await this.enumerateDevices();
            if (devices.length === 0) {
                this.error("No video input devices found. Please connect a camera.");
                throw new Error("No camera detected");
            }

            // Try each constraint variant
            const variants = this.getConstraintVariants();
            let lastError = null;

            for (let i = 0; i < variants.length; i++) {
                const constraints = variants[i];
                this.log(`Attempting getUserMedia with variant ${i+1}`, constraints);
                try {
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    this.log(`Stream acquired successfully with variant ${i+1}`);
                    this.localStream = stream;
                    this.currentConstraints = constraints;

                    // Attach to video element
                    this.videoElement.srcObject = stream;
                    this.videoElement.onloadedmetadata = () => {
                        this.videoElement.play().catch(e => {
                            this.error("Autoplay failed", e);
                            // Autoplay may be blocked; user interaction required. We'll show a message.
                        });
                        this.log("Video metadata loaded, stream playing");
                    };
                    this.isStreaming = true;

                    // Log stream tracks
                    stream.getTracks().forEach(track => {
                        this.log(`Track added: ${track.kind}, enabled: ${track.enabled}, readyState: ${track.readyState}`);
                    });
                    return stream;
                } catch (err) {
                    lastError = err;
                    this.error(`Variant ${i+1} failed`, err);
                    // Continue to next variant
                }
            }

            // All variants failed - provide detailed error mapping
            const errorMap = this.mapError(lastError);
            throw new Error(errorMap.userMessage);
        }

        mapError(error) {
            let userMessage = "Unable to access camera. ";
            let technicalDetails = error.message;

            switch (error.name) {
                case 'NotAllowedError':
                    userMessage = "Camera permission denied by user. Please allow camera access and refresh.";
                    break;
                case 'NotFoundError':
                    userMessage = "No camera device found on this device. Please connect a camera.";
                    break;
                case 'NotReadableError':
                    userMessage = "Camera is already in use by another application. Close other apps and try again.";
                    break;
                case 'SecurityError':
                    userMessage = "Camera access blocked due to security restrictions (HTTPS required).";
                    break;
                case 'OverconstrainedError':
                    userMessage = "Camera does not support required resolution. Trying fallback...";
                    break;
                default:
                    userMessage = `Camera error: ${error.message || "Unknown error"}`;
            }
            this.error(`Final error mapping: ${userMessage}`, error);
            return { userMessage, technicalDetails };
        }

        stopStream() {
            if (!this.localStream) {
                this.log("No active stream to stop");
                return;
            }
            this.log("Stopping stream and releasing tracks");
            this.localStream.getTracks().forEach(track => {
                track.stop();
                this.log(`Track ${track.kind} stopped`);
            });
            this.videoElement.srcObject = null;
            this.localStream = null;
            this.isStreaming = false;
        }

        isActive() {
            return this.isStreaming && this.localStream !== null && this.localStream.active;
        }
    }

    // -------------------------- AUTH & APP STATE (unchanged but integrated) --------------------------
    const countryList = ["United States", "Canada", "United Kingdom", "Australia", "Germany", "France", "Spain", "Italy", "Netherlands", "Sweden", "Brazil", "Mexico", "India", "Japan", "South Korea", "Kenya", "UAE"];
    let users = JSON.parse(localStorage.getItem("flamematch_users")) || [];
    let currentSessionUser = JSON.parse(sessionStorage.getItem("flamematch_session")) || null;
    function saveUsers() { localStorage.setItem("flamematch_users", JSON.stringify(users)); }
    function saveSession(user) { currentSessionUser = user; sessionStorage.setItem("flamematch_session", JSON.stringify(user)); }
    function clearSession() { sessionStorage.removeItem("flamematch_session"); currentSessionUser = null; }
    function signup(email, password, name, age, country) {
        if (!email || !password || !name || !age || !country) return { success: false, error: "All fields required" };
        if (users.find(u => u.email === email)) return { success: false, error: "Email exists" };
        const newUser = { id: Date.now().toString(), email, password, name, age: parseInt(age), country, bio: "✨ New to FlameMatch!", photoId: "user_alex_def", coins: 450, customPhotoURL: null };
        users.push(newUser);
        saveUsers();
        return { success: true, user: newUser };
    }
    function login(email, password) {
        const user = users.find(u => u.email === email && u.password === password);
        if (!user) return { success: false, error: "Invalid credentials" };
        return { success: true, user };
    }

    let appData = { discoverProfiles: [], matchesList: [], userCoins: 450, currentUserBio: "", customUserPhotoURL: null };
    const DEFAULT_DISCOVER = [
        { id: "p_jennie", name: "Jennie Karao", age: 20, occupation: "UI Designer", matchPercentage: 89, bio: "Pixel perfect & latte art lover.", liked: false },
        { id: "p_natalie", name: "Natalie Morris", age: 25, occupation: "Fashion Designer", matchPercentage: 90, bio: "Runway dreams & thrift flips.", liked: false },
        { id: "p_emma", name: "Emma Ora", age: 24, occupation: "Comedian", matchPercentage: 100, bio: "Making you laugh is my superpower.", liked: false }
    ];
    const DEFAULT_MATCHES = [
        { id: "match_natalie", name: "Natalie Morris", age: 25, occupation: "Fashion Designer", matchPercentage: 90, lastMessage: "That outfit is fire! 🔥", chatMessages: [{ text: "Hey! Love your style", sender: "them", time: "2:30 PM" }] }
    ];
    const PHOTOS = {
        p_jennie: "https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=600&q=80",
        p_natalie: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600&q=80",
        p_emma: "https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=600&q=80",
        match_natalie: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600&q=80",
        user_alex_def: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=600&q=80",
    };
    function photoUrl(id) { if (id === "user_alex" && appData.customUserPhotoURL) return appData.customUserPhotoURL; return PHOTOS[id] || PHOTOS.user_alex_def; }
    
    function loadUserData(userId) {
        const stored = localStorage.getItem(`flamematch_data_${userId}`);
        if (stored) { const data = JSON.parse(stored); appData.discoverProfiles = data.discoverProfiles || [...DEFAULT_DISCOVER]; appData.matchesList = data.matchesList || [...DEFAULT_MATCHES]; appData.userCoins = data.userCoins ?? 450; appData.currentUserBio = data.currentUserBio || ""; appData.customUserPhotoURL = data.customPhotoURL || null; }
        else { appData.discoverProfiles = [...DEFAULT_DISCOVER]; appData.matchesList = [...DEFAULT_MATCHES]; appData.userCoins = 450; appData.currentUserBio = ""; }
        const user = users.find(u => u.id === userId); if (user) user.coins = appData.userCoins;
    }
    function saveUserData(userId) { localStorage.setItem(`flamematch_data_${userId}`, JSON.stringify({ discoverProfiles: appData.discoverProfiles, matchesList: appData.matchesList, userCoins: appData.userCoins, currentUserBio: appData.currentUserBio, customPhotoURL: appData.customUserPhotoURL })); }
    
    let activeTab = "discover";
    let currentChatPartner = null;
    let cameraEngine = null; // singleton reference

    function updateCoinUI() { const el = document.getElementById("coinAmount"); if (el) el.innerText = appData.userCoins; }
    function addMatch(profile) { if (!appData.matchesList.find(m => m.id === profile.id)) { appData.matchesList.unshift({ id: profile.id, name: profile.name, age: profile.age, occupation: profile.occupation, matchPercentage: profile.matchPercentage, lastMessage: "You matched! Say hi ✨", chatMessages: [{ text: "You matched!", sender: "them", time: "now" }] }); return true; } return false; }
    function likeProfile(profile) { if (profile.liked) return; profile.liked = true; const willMatch = Math.random() > 0.25; if (willMatch) addMatch(profile); alert(willMatch ? `💖 Match with ${profile.name}!` : `👍 Liked ${profile.name}`); const idx = appData.discoverProfiles.findIndex(p => p.id === profile.id); if (idx !== -1) appData.discoverProfiles.splice(idx, 1); saveUserData(currentSessionUser.id); renderCurrentTab(); }
    function passProfile(profile) { const idx = appData.discoverProfiles.findIndex(p => p.id === profile.id); if (idx !== -1) appData.discoverProfiles.splice(idx, 1); saveUserData(currentSessionUser.id); renderCurrentTab(); }
    function superLike(profile) { if (appData.userCoins < 50) { alert("Need 50 gems"); return; } appData.userCoins -= 50; updateCoinUI(); addMatch(profile); alert(`✨ SuperLiked ${profile.name}!`); const idx = appData.discoverProfiles.findIndex(p => p.id === profile.id); if (idx !== -1) appData.discoverProfiles.splice(idx, 1); saveUserData(currentSessionUser.id); renderCurrentTab(); }
    function sendMessage(partnerId, text) { if (!text.trim()) return; const match = appData.matchesList.find(m => m.id === partnerId); if (match) { match.chatMessages.push({ text, sender: "me", time: "now" }); match.lastMessage = text; saveUserData(currentSessionUser.id); renderChatScreen(partnerId); } }
    
    function renderChatScreen(partnerId) { /* simplified for brevity, same as before but functional */ const partner = appData.matchesList.find(m => m.id === partnerId); if (!partner) return; currentChatPartner = partner; const container = document.getElementById("appContent"); let messagesHtml = ""; partner.chatMessages.forEach(msg => { messagesHtml += `<div class="msg-bubble ${msg.sender === 'me' ? 'msg-sent' : 'msg-received'}">${msg.sender === 'them' ? `<strong>${partner.name}</strong> ` : ''}${escapeHtml(msg.text)}</div>`; }); container.innerHTML = `<div class="modern-card" style="padding:20px;"><div class="chat-header-match"><div style="width:54px;height:54px;border-radius:54px;overflow:hidden;"><img src="${photoUrl(partnerId)}" style="width:100%;"></div><div><strong>${partner.name}, ${partner.age}</strong><br><span style="color:#f472b6;">${partner.matchPercentage}% match</span></div><i class="fas fa-arrow-left" id="backToMatchesBtn" style="margin-left:auto;color:#ec4899;font-size:24px;cursor:pointer;"></i></div><div class="messages-box" id="chatMessagesBox">${messagesHtml}</div><div class="chat-input-area"><input id="chatMessageInput" placeholder="Message..." style="flex:1;background:transparent;border:none;color:white;padding:12px;"><button id="sendChatBtn" style="background:#ec4899;border:none;width:46px;height:46px;border-radius:46px;"><i class="fas fa-paper-plane"></i></button></div></div>`; document.getElementById("backToMatchesBtn")?.addEventListener("click", () => { currentChatPartner = null; activeTab = "matches"; renderCurrentTab(); }); document.getElementById("sendChatBtn")?.addEventListener("click", () => { const inp = document.getElementById("chatMessageInput"); if (inp.value.trim()) { sendMessage(partnerId, inp.value); inp.value = ""; setTimeout(() => document.getElementById("chatMessagesBox")?.scrollTo(0,99999),30); } }); attachModernCardStyles(); }
    function renderMatchesTab() { if (currentChatPartner) return renderChatScreen(currentChatPartner.id); const container = document.getElementById("appContent"); if (!appData.matchesList.length) { container.innerHTML = `<div class="modern-card" style="text-align:center;padding:60px;"><i class="fas fa-heart-broken"></i><p>No matches yet</p></div>`; attachModernCardStyles(); return; } let html = `<h3 style="color:white;">Matches · ${appData.matchesList.length}</h3>`; appData.matchesList.forEach(m => { html += `<div class="modern-card match-item"><div class="match-avatar"><img src="${photoUrl(m.id)}"></div><div class="match-info"><div class="match-name">${m.name}, ${m.age} <span class="match-percentage">${m.matchPercentage}%</span></div><div>${m.occupation}</div><div>💬 ${m.lastMessage.substring(0,35)}</div></div><button class="chat-btn" data-chatid="${m.id}">Chat</button></div>`; }); container.innerHTML = html; document.querySelectorAll(".chat-btn").forEach(btn => btn.addEventListener("click", () => renderChatScreen(btn.getAttribute("data-chatid")))); attachModernCardStyles(); }
    
    let startX=0, currentX=0, isDragging=false;
    function attachSwipeEvents(card, profile) { if(!card) return; const onMove=(e)=>{if(!isDragging) return; const dx=(e.touches?e.touches[0].clientX:e.clientX)-startX; currentX=dx; card.style.transform=`translateX(${dx}px) rotate(${dx*0.03}deg)`; card.style.opacity=Math.max(0.5,1-Math.abs(dx)/400); }; const onEnd=()=>{if(!isDragging) return; isDragging=false; if(currentX>110) likeProfile(profile); else if(currentX<-110) passProfile(profile); else{card.style.transform=""; card.style.opacity="";} document.removeEventListener("mousemove",onMove); document.removeEventListener("mouseup",onEnd); }; const onStart=(e)=>{ if(e.target.closest('.action-btn')) return; isDragging=true; startX=e.touches?e.touches[0].clientX:e.clientX; currentX=0; document.addEventListener("mousemove",onMove); document.addEventListener("mouseup",onEnd); }; card.addEventListener("mousedown",onStart); card.addEventListener("touchstart",onStart,{passive:false}); }
    
    function renderDiscoverTab() { const container = document.getElementById("appContent"); if(appData.discoverProfiles.length===0){ container.innerHTML=`<div class="modern-card" style="text-align:center;padding:40px;"><i class="fas fa-check-circle"></i><p>No more profiles! <button id="resetDiscoverBtn" class="reset-btn">Reset</button></p></div>`; document.getElementById("resetDiscoverBtn")?.addEventListener("click",()=>{ appData.discoverProfiles=[...DEFAULT_DISCOVER]; saveUserData(currentSessionUser.id); renderCurrentTab(); }); attachModernCardStyles(); return; } const profile=appData.discoverProfiles[0]; container.innerHTML=`<div class="modern-card" id="draggableCard"><div class="profile-img"><div class="match-percent-badge">${profile.matchPercentage}%</div><img src="${photoUrl(profile.id)}"></div><div class="profile-info"><div class="profile-name">${profile.name}, ${profile.age}</div><div class="profile-occupation">${profile.occupation}</div><div class="profile-bio">${profile.bio}</div></div><div class="action-buttons"><button class="action-btn btn-pass" id="passBtn"><i class="fas fa-times"></i></button><button class="action-btn btn-super" id="superBtn"><i class="fas fa-star"></i></button><button class="action-btn btn-like" id="likeBtn"><i class="fas fa-heart"></i></button></div></div><div class="swipe-hint">Swipe → like | ← pass | ⭐ SuperLike (50💎)</div>`; attachSwipeEvents(document.getElementById("draggableCard"), profile); document.getElementById("passBtn")?.addEventListener("click",()=>passProfile(profile)); document.getElementById("likeBtn")?.addEventListener("click",()=>likeProfile(profile)); document.getElementById("superBtn")?.addEventListener("click",()=>superLike(profile)); attachModernCardStyles(); }
    
    function renderProfileTab() { const user = currentSessionUser; const container = document.getElementById("appContent"); container.innerHTML = `<div class="modern-card my-profile-card"><div class="user-profile-photo"><img src="${photoUrl('user_alex')}"></div><h2 style="color:white;">${user.name}, ${user.age}</h2><p>📍 ${user.country}</p><p>${appData.currentUserBio || user.bio}</p><label class="upload-label">Upload Photo <input type="file" id="profilePhotoFile" accept="image/*" style="display:none;"></label><button id="resetPhotoBtn" class="reset-photo-btn">Reset</button><div><i class="fas fa-gem"></i> ${appData.userCoins} gems</div><button id="dailyBonusBtn" style="background:linear-gradient(145deg,#f59e0b,#b45309);border:none;padding:14px;border-radius:60px;color:white;">✨ Daily Bonus +50 Gems ✨</button><input id="editBioInput" class="edit-field" value="${escapeHtml(appData.currentUserBio || user.bio)}"><button id="saveBioBtn" style="background:#ec4899;margin-top:12px;padding:12px;">Save</button><select id="editCountrySelect" class="edit-field">${countryList.map(c => `<option value="${c}" ${c === user.country ? 'selected' : ''}>${c}</option>`).join('')}</select><button id="saveCountryBtn" style="background:#ec4899;margin-top:8px;padding:10px;">Update Country</button><button id="logoutBtn" style="background:#2e2a3e;margin-top:20px;padding:12px;">Logout</button></div>`; document.getElementById("profilePhotoFile")?.addEventListener("change",(e)=>{ if(e.target.files[0]){ appData.customUserPhotoURL = URL.createObjectURL(e.target.files[0]); saveUserData(currentSessionUser.id); renderProfileTab(); showToast("Photo updated"); } }); document.getElementById("resetPhotoBtn")?.addEventListener("click",()=>{ appData.customUserPhotoURL=null; saveUserData(currentSessionUser.id); renderProfileTab(); showToast("Default photo"); }); document.getElementById("dailyBonusBtn")?.addEventListener("click",()=>{ appData.userCoins+=50; updateCoinUI(); saveUserData(currentSessionUser.id); renderProfileTab(); showToast("+50 gems!"); }); document.getElementById("saveBioBtn")?.addEventListener("click",()=>{ appData.currentUserBio = document.getElementById("editBioInput").value; saveUserData(currentSessionUser.id); renderProfileTab(); showToast("Bio saved"); }); document.getElementById("saveCountryBtn")?.addEventListener("click",()=>{ currentSessionUser.country = document.getElementById("editCountrySelect").value; saveUsers(); saveSession(currentSessionUser); renderProfileTab(); showToast("Country updated"); }); document.getElementById("logoutBtn")?.addEventListener("click",()=>{ if(cameraEngine) cameraEngine.stopStream(); clearSession(); showAuthScreen(); }); attachModernCardStyles(); }
    
    // ----- FIXED LIVE TAB WITH ADVANCED CAMERA ENGINE -----
    function renderLiveTab() {
        if (cameraEngine) {
            cameraEngine.stopStream();
            cameraEngine = null;
        }
        const container = document.getElementById("appContent");
        container.innerHTML = `<div class="modern-card" style="padding:20px;"><div class="live-video-wrapper"><video id="liveVideoElement" autoplay playsinline muted style="width:100%;border-radius:40px;"></video></div><div class="live-controls"><button id="startLiveBtn" class="live-btn"><i class="fas fa-play"></i> START LIVE</button><button id="stopLiveBtn" class="live-btn" style="background:#4a2e3a;"><i class="fas fa-stop"></i> STOP</button></div><div id="liveStatusMsg" class="viewers-sim" style="text-align:center;margin-top:12px;">🔴 Not live — press Start</div><div id="liveDebugLog" style="font-size:10px;color:#aaa;margin-top:12px;max-height:100px;overflow-y:auto;background:#00000055;border-radius:12px;padding:8px;"></div></div>`;
        
        const videoElement = document.getElementById("liveVideoElement");
        const startBtn = document.getElementById("startLiveBtn");
        const stopBtn = document.getElementById("stopLiveBtn");
        const statusSpan = document.getElementById("liveStatusMsg");
        const debugDiv = document.getElementById("liveDebugLog");
        let viewerInterval = null;
        
        function updateDebugLog(engine) {
            if (engine && engine.debugLogs) {
                debugDiv.innerHTML = engine.debugLogs.slice(-5).map(l => `<div>📹 ${escapeHtml(l)}</div>`).join('');
            }
        }
        
        startBtn.onclick = async () => {
            if (cameraEngine && cameraEngine.isActive()) {
                showToast("Already live streaming");
                return;
            }
            statusSpan.innerHTML = "⏳ Requesting camera...";
            try {
                cameraEngine = new CameraEngine("liveVideoElement");
                // Show live logs periodically
                const logInterval = setInterval(() => updateDebugLog(cameraEngine), 1000);
                await cameraEngine.startStream();
                clearInterval(logInterval);
                updateDebugLog(cameraEngine);
                statusSpan.innerHTML = `<span style="background:red;padding:4px 12px;border-radius:40px;">🔴 LIVE · 12 viewers watching</span>`;
                showToast("🔴 You are live! Professional stream active");
                let viewers = 12;
                if (viewerInterval) clearInterval(viewerInterval);
                viewerInterval = setInterval(() => {
                    if (cameraEngine && cameraEngine.isActive()) {
                        viewers += Math.floor(Math.random() * 3);
                        statusSpan.innerHTML = `<span style="background:red;padding:4px 12px;border-radius:40px;">🔴 LIVE · ${viewers} watching</span>`;
                    }
                }, 5000);
            } catch (err) {
                console.error("Camera start failed", err);
                const errorMsg = err.message || "Unknown camera error";
                statusSpan.innerHTML = `❌ ${errorMsg}`;
                showToast(`Camera error: ${errorMsg}`, "#ff4d4d");
                if (cameraEngine) updateDebugLog(cameraEngine);
            }
        };
        
        stopBtn.onclick = () => {
            if (cameraEngine) {
                cameraEngine.stopStream();
                cameraEngine = null;
                if (viewerInterval) clearInterval(viewerInterval);
                statusSpan.innerHTML = "Stream ended — press Start to go live again";
                debugDiv.innerHTML = "";
                showToast("Live stream ended");
            } else {
                showToast("No active live stream");
            }
        };
        attachModernCardStyles();
    }
    
    function renderCurrentTab() {
        if(activeTab==="discover") renderDiscoverTab();
        else if(activeTab==="matches") renderMatchesTab();
        else if(activeTab==="live") renderLiveTab();
        else if(activeTab==="profile") renderProfileTab();
        document.querySelectorAll(".nav-item").forEach(item=>item.classList.toggle("nav-active",item.getAttribute("data-tab")===activeTab));
        updateCoinUI();
    }
    
    function attachModernCardStyles() { document.querySelectorAll('.modern-card').forEach(card => card.classList.add('is-visible')); }
    function showToast(msg,bg="#ec4899"){ const t=document.createElement("div"); t.innerText=msg; Object.assign(t.style,{position:"fixed",bottom:"90px",left:"50%",transform:"translateX(-50%)",backgroundColor:bg,padding:"10px 20px",borderRadius:"60px",color:"white",zIndex:"999"}); document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }
    function escapeHtml(str){ return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
    
    class UIEngine { constructor() { this.observeCards(); } observeCards() { document.querySelectorAll('.modern-card').forEach(c => c.classList.add('is-visible')); } }
    
    function showAuthScreen() {
        const root = document.getElementById("root");
        root.innerHTML = `<div class="auth-container"><div class="auth-logo"><h1>FlameMatch</h1></div><div id="authForm"><input type="email" id="authEmail" class="auth-input" placeholder="Email"><input type="password" id="authPassword" class="auth-input" placeholder="Password"><div id="authExtraFields" style="display:none;"><input type="text" id="authName" class="auth-input" placeholder="Full Name"><input type="number" id="authAge" class="auth-input" placeholder="Age"><select id="authCountry" class="auth-select">${countryList.map(c => `<option>${c}</option>`).join('')}</select></div><button id="authSubmitBtn" class="auth-btn">Login</button><div class="auth-switch">New here? <span id="toggleAuthMode">Create account</span></div><div id="authError" class="auth-error"></div></div></div>`;
        let isLogin = true; const extraDiv = document.getElementById("authExtraFields"), submitBtn = document.getElementById("authSubmitBtn"), toggle = document.getElementById("toggleAuthMode"), errorDiv = document.getElementById("authError");
        const emailInp = document.getElementById("authEmail"), passInp = document.getElementById("authPassword");
        function setMode(login) { isLogin = login; extraDiv.style.display = login ? "none" : "block"; submitBtn.innerText = login ? "Login" : "Sign Up"; toggle.innerText = login ? "Create account" : "Back to Login"; }
        toggle.onclick = () => setMode(!isLogin);
        submitBtn.onclick = () => {
            const email = emailInp.value.trim(), password = passInp.value.trim();
            if (!email || !password) { errorDiv.innerText = "Required"; return; }
            if (isLogin) {
                const result = login(email, password);
                if (result.success) { saveSession(result.user); loadUserData(result.user.id); initMainApp(); } else errorDiv.innerText = result.error;
            } else {
                const name = document.getElementById("authName")?.value.trim(), age = document.getElementById("authAge")?.value, country = document.getElementById("authCountry")?.value;
                if (!name || !age || age<18) { errorDiv.innerText = "Valid name and age"; return; }
                const result = signup(email, password, name, age, country);
                if (result.success) { saveSession(result.user); loadUserData(result.user.id); initMainApp(); } else errorDiv.innerText = result.error;
            }
        };
    }
    
    function initMainApp() {
        const root = document.getElementById("root");
        root.innerHTML = `<div class="dating-app"><div class="main-header"><div class="logo-area"><h1>FlameMatch❤️‍🔥</h1></div><div class="coin-badge"><i class="fas fa-gem"></i> <span id="coinAmount">${appData.userCoins}</span></div></div><div class="content-area" id="appContent"></div><div class="bottom-nav"><div class="nav-item" data-tab="discover"><i class="fas fa-fire"></i><span>For You</span></div><div class="nav-item" data-tab="matches"><i class="fas fa-heart"></i><span>Matches</span></div><div class="nav-item" data-tab="live"><i class="fas fa-video"></i><span>Live</span></div><div class="nav-item" data-tab="profile"><i class="fas fa-user"></i><span>Profile</span></div></div></div>`;
        activeTab = "discover"; currentChatPartner = null;
        renderCurrentTab();
        document.querySelectorAll(".nav-item").forEach(item => { item.addEventListener("click", () => { const tab = item.getAttribute("data-tab"); if (tab) { if (activeTab === "live" && tab !== "live" && cameraEngine) cameraEngine.stopStream(); activeTab = tab; currentChatPartner = null; renderCurrentTab(); } }); });
        updateCoinUI();
        new UIEngine();
        attachModernCardStyles();
        // Diagnostic log for HTTPS
        if (location.protocol !== 'https:' && location.hostname !== 'localhost') console.warn("⚠️ Not using HTTPS – camera access may be blocked on some browsers");
    }
    
    if (currentSessionUser) { loadUserData(currentSessionUser.id); initMainApp(); } else { showAuthScreen(); }
</script>
</body>
